name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: build + test (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, lyrical]
    container:
      image: ros:${{ matrix.distro }}-ros-base
    defaults:
      run:
        shell: bash
        working-directory: ros2_ws
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build --packages-skip dog_gazebo --event-handlers console_cohesion+
      - name: Test
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon test --packages-skip dog_gazebo --event-handlers console_cohesion+
          colcon test-result --verbose
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs-${{ matrix.distro }}
          path: ros2_ws/log

  simulation:
    name: gazebo walk check (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, lyrical]
    container:
      image: osrf/ros:${{ matrix.distro }}-simulation
    defaults:
      run:
        shell: bash
        working-directory: ros2_ws
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build
      - name: Walk in Gazebo
        timeout-minutes: 10
        run: |
          source install/setup.bash
          ros2 launch dog_gazebo sim.launch.py headless:=true web:=false > sim.log 2>&1 &
          ros2 run dog_gazebo walk_check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sim-log-${{ matrix.distro }}
          path: ros2_ws/sim.log

  robot-image:
    name: robot image (arm64)
    # Emulated arm64 C++ build is slow; run on main and on demand only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build docker/Dockerfile for linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: false
          build-args: BUILD_JOBS=4
