name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      acceptance:
        description: Run the backward-walk acceptance job (CI only, D-04)
        type: boolean
        default: false
      repeats:
        description: Valid repeats per acceptance cell (1-20)
        type: string
        default: '5'
      cells:
        description: Acceptance cells to run
        type: choice
        options:
          - all
          - flat_A_bwd10
          - flat_B_bwd10
          - flat_B_bwd05
          - waves10_A_bwd10
          - rocks10_A_bwd10
        default: all
      strict:
        description: Fail the job unless the acceptance verdict passes
        type: boolean
        default: false
      trace:
        description: Keep a walk_check trace per acceptance repeat (01-18)
        type: boolean
        default: false
      friction:
        description: Contact friction of the terrain, mu (1.0 = shipped floor, 0.6 = 02-CONTEXT D-03)
        type: string
        default: '1.0'
      payload:
        description: Load on the trunk in kg (0 = shipped robot, 0.296 = +20 % of total mass)
        type: string
        default: '0.0'
      slope_levels:
        description: Slope angles for the terrain job, comma separated (e.g. "7,10")
        type: string
        default: '10'
      servo_speed:
        description: Servo speed for the acceptance [rad/s], empty keeps servo_velocity (e.g. 3.5)
        type: string
        default: ''
      servo_delay:
        description: Command delay for the acceptance [ms], empty keeps servo_sim's 40 (e.g. 50)
        type: string
        default: ''
      gait_period:
        description: Trot cycle for the acceptance [s], empty keeps gait.period (e.g. 0.65)
        type: string
        default: ''
      gait_duty:
        description: Stance share for the acceptance, empty keeps gait.duty (e.g. 0.75)
        type: string
        default: ''
      step_height:
        description: Swing apex for the acceptance [m], empty keeps gait.step_height (e.g. 0.015)
        type: string
        default: ''

jobs:
  build-test:
    name: build + test (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, lyrical]
    container:
      image: ros:${{ matrix.distro }}-ros-base
    defaults:
      run:
        shell: bash
        working-directory: ros2_ws
    steps:
      - uses: actions/checkout@v4
      - name: Extra ROS packages
        run: apt-get update -qq && apt-get install -y -qq ros-${{ matrix.distro }}-std-srvs && apt-get upgrade -y -qq
      - name: Build
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build --packages-skip dog_gazebo --event-handlers console_cohesion+
      - name: Test
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon test --packages-skip dog_gazebo --event-handlers console_cohesion+
          colcon test-result --verbose
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs-${{ matrix.distro }}
          path: ros2_ws/log

  autocal:
    name: camera auto-calibration tool
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/autocal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy opencv-contrib-python-headless pytest
      - run: python -m pytest -q tests
      - run: python -m robotdog_autocal demo

  robot-setup:
    name: robot parameter form (tools/robot_setup)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml pytest
      - run: python -m pytest -q tools/robot_setup/test
      - name: The committed config passes the checks
        run: python tools/robot_setup/robot_setup.py --check

  simulation:
    name: gazebo walk check (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, lyrical]
    container:
      image: osrf/ros:${{ matrix.distro }}-simulation
    defaults:
      run:
        shell: bash
        working-directory: ros2_ws
    steps:
      - uses: actions/checkout@v4
      - name: Extra ROS packages
        run: apt-get update -qq && apt-get install -y -qq ros-${{ matrix.distro }}-std-srvs && apt-get upgrade -y -qq
      - name: Build
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build
      - name: Walk in Gazebo
        timeout-minutes: 10
        run: |
          source install/setup.bash
          ros2 launch dog_gazebo sim.launch.py headless:=true web:=false > sim.log 2>&1 &
          # D-05: 0.8 x the lowest backward ratio over 15 repeats of the ideal model,
          # rounded down to 0.05 -> jazzy 0.30, lyrical 0.30 (the lyrical number is an
          # assumption: the owner has not confirmed per-distro thresholds). Source:
          # acceptance/final2/, 01-ACCEPTANCE-REPORT.md, docs/TERRAIN.md. It used to
          # be 0.2, back when the 40 % default failed once at 39 %.
          ros2 run dog_gazebo walk_check --backward-ratio ${{ matrix.distro == 'jazzy' && '0.30' || '0.30' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sim-log-${{ matrix.distro }}
          path: ros2_ws/sim.log

  terrain:
    name: terrain limits (slope / waves / rough)
    # Positive checks at the recommended limits from docs/TERRAIN.md: every
    # maneuver must pass on each terrain (no fall, tilt < 20 deg, a share of
    # the commanded distance: 40 % on the slope, 25 % on stones, 15 % on waves
    # where walking backwards only creeps).
    runs-on: ubuntu-24.04
    container:
      image: osrf/ros:jazzy-simulation
    env:
      FRICTION: ${{ inputs.friction || '1.0' }}
      SLOPE_LEVELS: ${{ inputs.slope_levels || '10' }}
    defaults:
      run:
        shell: bash
        working-directory: ros2_ws
    steps:
      - uses: actions/checkout@v4
      - name: Extra ROS packages
        run: apt-get update -qq && apt-get install -y -qq ros-jazzy-std-srvs && apt-get upgrade -y -qq
      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build
      - name: Slope 10 deg (climb, traverse, turn, descend)
        timeout-minutes: 8
        run: |
          source install/setup.bash
          ros2 run dog_gazebo terrain_sweep --terrain slope --levels ${SLOPE_LEVELS//,/ } --friction "$FRICTION" --out slope.json
      - name: Waves 10 mm
        timeout-minutes: 8
        run: |
          source install/setup.bash
          # backward on uneven ground is the weak manoeuvre (TERRAIN.md: 0-36 %
          # of the command, run to run): checked for no fall / tilt / sagging only
          ros2 run dog_gazebo terrain_sweep --terrain waves --levels 10 --min-ratio 0.15 --backward-ratio 0 --domain 61 --friction "$FRICTION" --out waves.json
      - name: Stones 10 mm
        timeout-minutes: 8
        run: |
          source install/setup.bash
          # backward on uneven ground is the weak manoeuvre (TERRAIN.md: 0-36 %
          # of the command, run to run): checked for no fall / tilt / sagging only
          ros2 run dog_gazebo terrain_sweep --terrain rough --levels 10 --min-ratio 0.25 --backward-ratio 0 --domain 62 --friction "$FRICTION" --out rough.json
      - uses: actions/upload-artifact@v4
        if: always()
        # the sweep numbers are the data of a wave, not just a pass/fail
        with:
          name: terrain-json
          path: |
            ros2_ws/slope*.json
            ros2_ws/waves*.json
            ros2_ws/rough*.json
            ros2_ws/*.sim.log
      - name: Perception (X lidars, GS2, ToF) - flat, no false alarms, guard never stops
        timeout-minutes: 8
        run: |
          source install/setup.bash
          # its own ROS domain and gz partition: a simulation left over from the
          # step before (slow to die on a slow runner) mixed its odometry in
          export ROS_DOMAIN_ID=71 GZ_PARTITION=perception1
          ros2 launch dog_gazebo sim.launch.py headless:=true web:=false perception:=true > perc_flat.log 2>&1 &
          ros2 run dog_gazebo perception_check --terrain flat --seconds 12 --expect --expect-guard | tee perception_flat.txt | tail -n 25 || { echo '--- full report'; grep -v '^\[' perception_flat.txt | head -n 200; echo '--- guard'; grep -E 'guard:|avoid:|tof|gs2' perc_flat.log | sed 's/.*\]: //' | head -n 60; exit 1; }
          kill %1; sleep 3; pkill -f "gz sim" || true
      - name: Hazard guard - stops before an 80 mm wall without touching it
        timeout-minutes: 8
        run: |
          source install/setup.bash
          # its own ROS domain and gz partition: a simulation left over from the
          # step before (slow to die on a slow runner) mixed its odometry in
          export ROS_DOMAIN_ID=72 GZ_PARTITION=perception2
          ros2 launch dog_gazebo sim.launch.py headless:=true web:=false perception:=true terrain:=wall level:=80 > perc_wall.log 2>&1 &
          # 40 s: from afar the wall reads under 70 mm, the guard crawls at it
          # (~1 cm/s) until it reads it right at 0.3 m - 9 to 21 s of simulated time
          ros2 run dog_gazebo perception_check --terrain wall --level 80 --seconds 40 --expect-guard | tee perception_wall.txt | tail -n 25 || { echo '--- full report'; grep -v '^\[' perception_wall.txt | head -n 200; echo '--- guard'; grep -E 'guard:|avoid:|tof|gs2' perc_wall.log | sed 's/.*\]: //' | head -n 60; exit 1; }
          kill %1; sleep 3; pkill -f "gz sim" || true
      - name: Perception - steps 30 mm, every hazard in the path found, no fall
        timeout-minutes: 8
        run: |
          source install/setup.bash
          # its own ROS domain and gz partition: a simulation left over from the
          # step before (slow to die on a slow runner) mixed its odometry in
          export ROS_DOMAIN_ID=73 GZ_PARTITION=perception3
          ros2 launch dog_gazebo sim.launch.py headless:=true web:=false perception:=true terrain:=steps level:=30 > perc_steps.log 2>&1 &
          ros2 run dog_gazebo perception_check --terrain steps --level 30 --seconds 45 --expect --expect-guard | tee perception_steps.txt | tail -n 25 || { echo '--- full report'; grep -v '^\[' perception_steps.txt | head -n 200; echo '--- guard'; grep -E 'guard:|avoid:|tof|gs2' perc_steps.log | sed 's/.*\]: //' | head -n 60; exit 1; }
          kill %1; sleep 3; pkill -f "gz sim" || true
      - name: Greeting - kneels, paws up, stands up again, no fall
        timeout-minutes: 8
        run: |
          source install/setup.bash
          # its own ROS domain and gz partition: a simulation left over from the
          # step before (slow to die on a slow runner) mixed its odometry in
          export ROS_DOMAIN_ID=74 GZ_PARTITION=perception4
          ros2 launch dog_gazebo sim.launch.py headless:=true web:=false perception:=true > greet.log 2>&1 &
          ros2 run dog_gazebo perception_check --terrain flat --seconds 40 --greet --expect-guard | tee perception_greet.txt | tail -n 25 || { echo '--- full report'; grep -v '^\[' perception_greet.txt | head -n 200; echo '--- guard'; grep -E 'guard:|avoid:|tof|gs2' greet.log | sed 's/.*\]: //' | head -n 60; exit 1; }
          kill %1; sleep 3; pkill -f "gz sim" || true
      - name: Survey - looks up-down and left-right on the spot, ends standing
        timeout-minutes: 6
        run: |
          source install/setup.bash
          export ROS_DOMAIN_ID=75 GZ_PARTITION=perception5
          ros2 launch dog_gazebo sim.launch.py headless:=true web:=false perception:=true > survey.log 2>&1 &
          ros2 run dog_gazebo perception_check --terrain flat --seconds 16 --survey --expect-guard | tee perception_survey.txt | tail -n 25 || { echo '--- full report'; grep -v '^\[' perception_survey.txt | head -n 200; exit 1; }
          kill %1; sleep 3; pkill -f "gz sim" || true
      - name: Localization - map the room, then find the robot in the map from another start
        timeout-minutes: 16
        run: |
          source install/setup.bash
          # dead reckoning with a drifting gyro (0.3 deg/s) is what the map corrects
          sim() { ros2 launch dog_gazebo sim.launch.py headless:=true web:=false terrain:=room seed:=$1 \
                    dead_reckoning:=true gyro_bias:=0.3 localization:=true localization_mode:=$2 map:=$PWD/room_map > loc_$2.log 2>&1 & }
          report() { grep -v '^\[' $1 | head -n 80; grep -E 'localization|relocaliz|lost' $2 | sed 's/.*\]: //' | head -n 40; }
          export ROS_DOMAIN_ID=76 GZ_PARTITION=localization1
          sim 0 mapping
          ros2 run dog_gazebo localization_check --seed 0 --phase mapping --map $PWD/room_map --trace localization_mapping.json --expect | tee perception_loc_mapping.txt | tail -n 30 || { report perception_loc_mapping.txt loc_mapping.log; exit 1; }
          kill -INT %1; sleep 5; pkill -f "gz sim" || true
          export ROS_DOMAIN_ID=77 GZ_PARTITION=localization2
          sim 1 localize
          ros2 run dog_gazebo localization_check --seed 1 --map-seed 0 --phase localize --map $PWD/room_map --trace localization_localize.json --expect | tee perception_loc_localize.txt | tail -n 30 || { report perception_loc_localize.txt loc_localize.log; exit 1; }
          kill -INT %1; sleep 5; pkill -f "gz sim" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-results
          path: |
            ros2_ws/*.json
            ros2_ws/*.sim.log
            ros2_ws/perception_*.txt

  preflight:
    name: preflight and recording (pure python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      # Both suites are stdlib-only on purpose: the checks that decide whether the
      # robot may start must be testable without ROS and without the robot.
      - run: python -m pytest -q tools/preflight/test ros2_ws/src/dog_bringup/test/test_record.py

  robot-image:
    name: robot image (arm64) boots the stack
    # Emulated arm64 C++ build is slow; run on main and on demand only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build docker/Dockerfile for linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: robot-dog:ci
          build-args: BUILD_JOBS=4
      # CAL-09, first half: in a container there is no /dev/i2c-0, so the robot must
      # refuse to start. A preflight that passes here would be a rubber stamp.
      - name: Preflight refuses to start without the robot's hardware
        run: |
          set +e
          docker run --rm --platform linux/arm64 robot-dog:ci \
            python3 /ws/tools/preflight/preflight.py --args "backend:=pca9685 gamepad:=false"
          code=$?
          set -e
          echo "preflight exit code: $code (2 = blocked)"
          test "$code" -eq 2
      # CAL-09, second half: the image launches the real stack with the mock backend.
      - name: The image boots robot.launch.py backend:=mock
        # DOG_PREFLIGHT=off because the entrypoint sees the shell command, not the
        # launch arguments: the script asks preflight itself, with backend:=mock.
        run: >
          docker run --rm --platform linux/arm64 -e DOG_PREFLIGHT=off
          robot-dog:ci bash /ws/docker/ci_smoke.sh

  acceptance:
    name: acceptance (${{ matrix.distro }}, ${{ matrix.servo_model }})
    # Backward-walk acceptance statistics: workflow_dispatch only (D-04);
    # one simulation per runner (D-24).
    # Dispatch: gh workflow run ci.yml -f acceptance=true
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, lyrical]
        servo_model: [ideal, real]
    container:
      image: osrf/ros:${{ matrix.distro }}-simulation
    env:
      DISTRO: ${{ matrix.distro }}
      SERVO_MODEL: ${{ matrix.servo_model }}
      REPEATS: ${{ inputs.repeats }}
      CELLS: ${{ inputs.cells }}
      STRICT: ${{ inputs.strict }}
      TRACE: ${{ inputs.trace }}
      FRICTION: ${{ inputs.friction || '1.0' }}
      PAYLOAD: ${{ inputs.payload || '0.0' }}
      SERVO_SPEED: ${{ inputs.servo_speed }}
      SERVO_DELAY: ${{ inputs.servo_delay }}
      GAIT_PERIOD: ${{ inputs.gait_period }}
      GAIT_DUTY: ${{ inputs.gait_duty }}
      STEP_HEIGHT: ${{ inputs.step_height }}
    defaults:
      run:
        shell: bash
        working-directory: ros2_ws
    steps:
      - uses: actions/checkout@v4
      - name: Extra ROS packages
        run: apt-get update -qq && apt-get install -y -qq ros-${{ matrix.distro }}-std-srvs && apt-get upgrade -y -qq
      - name: Pure modules (pytest)
        run: |
          if ! python3 -c 'import pytest' 2>/dev/null; then
            apt-get update -qq && apt-get install -y -qq python3-pytest
          fi
          PYTHONPATH=src/dog_gazebo:src/dog_description python3 -m pytest -q src/dog_gazebo/test
      - name: Build
        run: |
          source /opt/ros/$DISTRO/setup.bash
          colcon build
      - name: URDF to SDF (real servo model)
        if: matrix.servo_model == 'real'
        run: |
          source install/setup.bash
          python3 -m dog_description.urdf src/dog_bringup/config/robot.yaml --gazebo --servo-model real > real_servo.urdf
          if ! command -v gz >/dev/null 2>&1 || ! gz sdf --help >/dev/null 2>&1; then
            echo "gz sdf is not available in this image: the SDF friction check is skipped"
            exit 0
          fi
          gz sdf -p real_servo.urdf > real_servo.sdf
          grep -c friction real_servo.sdf || true
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse('real_servo.sdf').getroot()
          n = sum(1 for d in root.iter('dynamics')
                  if d.find('friction') is not None and d.find('friction').text
                  and float(d.find('friction').text) > 0)
          print('dynamics with friction:', n)
          sys.exit(0 if n == 12 else 1)
          PY
      - name: Acceptance (backward walk statistics)
        run: |
          case "$REPEATS" in
            ''|*[!0-9]*)
              echo 'error: repeats must be digits only' >&2
              exit 2
              ;;
          esac
          source install/setup.bash
          set -- --repeats "$REPEATS" --cells "$CELLS" --servo-model "$SERVO_MODEL" --distro "$DISTRO" --domain 80
          if [ "$STRICT" = true ]; then set -- "$@" --strict; fi
          if [ "$TRACE" = true ]; then set -- "$@" --trace; fi
          if [ "$FRICTION" != 1.0 ]; then set -- "$@" --friction "$FRICTION"; fi
          if [ "$PAYLOAD" != 0.0 ]; then set -- "$@" --payload-mass "$PAYLOAD"; fi
          if [ -n "$SERVO_SPEED" ]; then set -- "$@" --servo-speed "$SERVO_SPEED"; fi
          if [ -n "$SERVO_DELAY" ]; then set -- "$@" --servo-delay-ms "$SERVO_DELAY"; fi
          if [ -n "$GAIT_PERIOD" ]; then set -- "$@" --gait-period "$GAIT_PERIOD"; fi
          if [ -n "$GAIT_DUTY" ]; then set -- "$@" --gait-duty "$GAIT_DUTY"; fi
          if [ -n "$STEP_HEIGHT" ]; then set -- "$@" --step-height "$STEP_HEIGHT"; fi
          ros2 run dog_gazebo acceptance "$@"
      - name: Job summary
        if: always()
        run: |
          f=acceptance_"$DISTRO"_"$SERVO_MODEL"_summary.md
          if [ -f "$f" ]; then
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'no summary written' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.distro }}-${{ matrix.servo_model }}
          path: |
            ros2_ws/acceptance_*.json
            ros2_ws/acceptance_*_summary.md
            ros2_ws/*.sim.log
            ros2_ws/*.trace.json

  servo-speed:
    name: servo speed analysis (tools/servo_speed)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pytest
      - run: python -m pytest -q tools/servo_speed/tests
