# Robot Dog 2.0 on the Banana Pi (Armbian, Docker).
#
#   docker compose up -d --build        # build on the Pi and start
#   docker compose logs -f
#   docker compose exec robot ros2 run dog_teleop keyboard_teleop --ros-args -r __ns:=/dog
#
# Web control: http://<pi-address>:8080
services:
  robot:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ROS_DISTRO: jazzy
    image: robot-dog:2.0
    container_name: robot_dog
    restart: unless-stopped
    network_mode: host          # ROS 2 discovery + web page on :8080
    devices:
      - /dev/i2c-0:/dev/i2c-0   # PCA9685 (0x40) + MPU6050 (0x68)
    volumes:
      - /dev/input:/dev/input   # gamepad (/dev/input/js0), survives re-plugging
      - ./ros2_ws/src/dog_bringup/config:/ws/install/dog_bringup/share/dog_bringup/config:ro
    device_cgroup_rules:
      - 'c 13:* rmw'            # input devices (js*, event*) plugged in later
    environment:
      - ROS_DOMAIN_ID=0
    stop_signal: SIGINT
    stop_grace_period: 10s
    command: >
      ros2 launch dog_bringup robot.launch.py
      backend:=pca9685 gamepad:=true gamepad_profile:=xbox web:=true
