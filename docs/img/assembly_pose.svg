<text x="20.0" y="28.0" fill="#12161b" font-size="15" text-anchor="start" font-weight="bold">Монтажная поза: все 12 серв на 1370 мкс, в этой позе надевают качалки</text><text x="40.0" y="62.0" fill="#12161b" font-size="13" text-anchor="start" font-weight="bold">Вид слева («вперёд» →)</text><rect x="180" y="98" width="260" height="46" rx="4" fill="#3b4452" opacity="0.9"/><text x="380.0" y="118.0" fill="#fff" font-size="13" text-anchor="start">корпус</text><line x1="60" y1="352.13203435596427" x2="440" y2="352.13203435596427" stroke="#8791a0" stroke-width="2"/><text x="405.0" y="370.1" fill="#8791a0" font-size="13" text-anchor="start">пол</text><line x1="310" y1="130" x2="203.9" y2="236.1" stroke="#d9892b" stroke-width="12" stroke-linecap="round"/><line x1="203.9" y1="236.1" x2="310.0" y2="342.1" stroke="#d9892b" stroke-width="9" stroke-linecap="round"/><circle cx="310.0" cy="342.1" r="10" fill="#333"/><circle cx="310.0" cy="130.0" r="9" fill="#fff" stroke="#12161b" stroke-width="2"/><circle cx="310.0" cy="130.0" r="2" fill="#12161b"/><circle cx="203.9" cy="236.1" r="8" fill="#fff" stroke="#12161b" stroke-width="2"/><circle cx="203.9" cy="236.1" r="2" fill="#12161b"/><line x1="310" y1="130" x2="310" y2="352.13203435596427" stroke="#8791a0" stroke-dasharray="5 4"/><path d="M310,200 A70,70 0 0,1 260.5,179.5" fill="none" stroke="#eb6834" stroke-width="2.2" marker-end="url(#o)"/><text x="320.0" y="222.0" fill="#eb6834" font-size="13" text-anchor="start" font-weight="bold">thigh = +45°</text><text x="320.0" y="238.0" fill="#eb6834" font-size="12" text-anchor="start">назад от вертикали</text><path d="M216.7,223.3 L229.4,236.1 L216.7,248.8" fill="none" stroke="#eb6834" stroke-width="2"/><text x="185.9" y="270.1" fill="#eb6834" font-size="13" text-anchor="end" font-weight="bold">calf = −90°</text><text x="185.9" y="286.1" fill="#eb6834" font-size="12" text-anchor="end">прямой угол, колено назад</text><text x="326.0" y="336.1" fill="#12161b" font-size="12" text-anchor="start">