 text-anchor="start" font-weight="bold">Рабочие позы (левая нога; у правой импульс зеркальный: 1370 − (импульс − 1370))</text><text x="20.0" y="420.1" fill="#12161b" font-size="12.5" text-anchor="start" font-weight="bold">поза</text><text x="330.0" y="420.1" fill="#12161b" font-size="12.5" text-anchor="start" font-weight="bold">бедро над полом</text><text x="500.0" y="420.1" fill="#12161b" font-size="12.5" text-anchor="start" font-weight="bold">thigh</text><text x="580.0" y="420.1" fill="#12161b" font-size="12.5" text-anchor="start" font-weight="bold">calf</text><text x="660.0" y="420.1" fill="#12161b" font-size="12.5" text-anchor="start" font-weight="bold">импульс thigh / calf, мкс</text><text x="20.0" y="440.1" fill="#12161b" font-size="12.5" text-anchor="start">монтажная (центр)</text><text x="330.0" y="440.1" fill="#12161b" font-size="12.5" text-anchor="start">148 мм</text><text x="500.0" y="440.1" fill="#12161b" font-size="12.5" text-anchor="start">+45.0°</text><text x="580.0" y="440.1" fill="#12161b" font-size="12.5" text-anchor="start">−90.0°</text><text x="660.0" y="440.1" fill="#12161b" font-size="12.5" text-anchor="start">1370 / 1370</text><text x="20.0" y="460.1" fill="#12161b" font-size="12.5" text-anchor="start">стойка stand</text><text x="330.0" y="460.1" fill="#12161b" font-size="12.5" text-anchor="start">150 мм</text><text x="500.0" y="460.1" fill="#12161b" font-size="12.5" text-anchor="start">+44.4°</text><text x="580.0" y="460.1" fill="#12161b" font-size="12.5" text-anchor="start">−88.8°</text><text x="660.0" y="460.1" fill="#12161b" font-size="12.5" text-anchor="start">1364 / 1381</text><text x="20.0" y="480.1" fill="#12161b" font-size="12.5" text-anchor="start">лёжа lie (первая поза после включения)</text><text x="330.0" y="480.1" fill="#12161b" font-size="12.5" text-anchor="start">80 мм</text><text x="500.0" y="480.1" fill="#12161b" font-size="12.5" text-anchor="start">+67.6°</text><text x="580.0" y="480.1" fill="#12161b" font-size="12.5" text-anchor="start">−135.2°</text><text x="660.0" y="480.1" fill="#12161b" font-size="12.5" text-anchor="start">1583 / 943</text><text x="20.0" y="500.1" fill="#12161b" font-size="12.5" text-anchor="start">самая высокая max_height</text><text x="330.0" y="500.1" fill="#12161b" font-size="12.5" text-anchor="start">180 мм</text><text x="500.0" y="500.1" fill="#12161b" font-size="12.5" text-anchor="start">+31.0°</text><text x="580.0" y="500.1" fill="#12161b" font-size="12.5" text-anchor="start">−62.0°</text><text x="660.0" y="500.1" fill="#12161b" font-size="12.5" text-anchor="start">1238 / 1634</text><text x="20.0" y="520.0" fill="#12161b" font-size="12" text-anchor="start">Импульс = 1370 + direction · (угол − offset_deg) · 9.44 мкс/°. Шлицы дают шаг 7–10°: ближайшее положение</text><text x="20.0" y="537.0" fill="#12161b" font-size="12" text-anchor="start">качалки к нужному углу, остаток убирает калибровка (DEPLOYMENT.md, этапы 5–6).</text></svg>
