<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
 <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12161b"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20.0" y="28.0" fill="#12161b" font-size="15" text-anchor="start" font-weight="bold">Приветствие: сидит на коленях задних ног, голени на полу (вид слева, «вперёд» →)</text><text x="20.0" y="62.0" fill="#12161b" font-size="13" text-anchor="start" font-weight="bold">1. Откинулся на 20°: передние лапы ещё на полу</text><line x1="20" y1="350" x2="420" y2="350" stroke="#8791a0" stroke-width="2"/><polygon points="54.0,272.2 270.1,193.5 253.0,146.5 36.9,225.2" fill="#3b4452" opacity="0.92"/><polyline points="68.9,240.1 107.0,338.0 212.0,338.0" fill="none" stroke="#d9892b" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="107.0" cy="338.0" r="12.0" fill="#333"/><circle cx="212.0" cy="338.0" r="12.0" fill="#333"/><circle cx="68.9" cy="240.1" r="5" fill="#fff" stroke="#12161b" stroke-width="2"/><circle cx="68.9" cy="240.1" r="2" fill="#12161b"/><polyline points="238.1,178.6 238.7,283.6 320.0,350.0" fill="none" stroke="#d9892b" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="320.0" cy="350.0" r="12.0" fill="#333"/><circle cx="238.1" cy="178.6" r="5" fill="#fff" stroke="#12161b" stroke-width="2"/><circle cx="238.1" cy="178.6" r="2" fill="#12161b"/><circle cx="153.5" cy="209.4" r="6" fill="#d64545"/><line x1="153.5" y1="209.4" x2="153.5" y2="350" stroke="#d64545" stroke-dasharray="4 3"/><line x1="107.0" y1="357" x2="200.0" y2="357" stroke="#2f8fb5" stroke-width="6"/><text x="470.0" y="62.0" fill="#12161b" font-size="13" text-anchor="start" font-weight="bold">2. Лапы вверх, корпус на 30°, машет</text><line x1="470" y1="350" x2="870" y2="350" stroke="#8791a0" stroke-width="2"/><polygon points="496.4,272.0 695.6,157.0 670.6,113.7 471.4,228.7" fill="#3b4452" opacity="0.92"/><polyline points="505.6,237.8 537.0,338.0 642.0,338.0" fill="none" stroke="#d9892b" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="537.0" cy="338.0" r="12.0" fill="#333"/><circle cx="642.0" cy="338.0" r="12.0" fill="#333"/><circle cx="505.6" cy="237.8" r="5" fill="#fff" stroke="#12161b" stroke-width="2"/><circle cx="505.6" cy="237.8" r="2" fill="#12161b"/><polyline points="661.4,147.8 671.2,252.4 753.4,187.1" fill="none" stroke="#7b5cc4" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="753.4" cy="187.1" r="12.0" fill="#333"/><circle cx="661.4" cy="147.8" r="5" fill="#fff" stroke="#12161b" stroke-width="2"/><circle cx="661.4" cy="147.8" r="2" fill="#12161b"/><circle cx="583.5" cy="192.8" r="6" fill="#d64545"/><line x1="583.5" y1="192.8" x2="583.5" y2="350" stroke="#d64545" stroke-dasharray="4 3"/><line x1="537.0" y1="357" x2="630.0" y2="357" stroke="#2f8fb5" stroke-width="6"/><text x="153.5" y="378.0" fill="#2f8fb5" font-size="12" text-anchor="middle" font-weight="bold">опора: колени … задние стопы (9 см)</text><text x="153.5" y="396.0" fill="#d64545" font-size="12" text-anchor="middle">центр масс посередине, запас 4.7 см</text><text x="583.5" y="378.0" fill="#2f8fb5" font-size="12" text-anchor="middle" font-weight="bold">опора: колени … задние стопы (9 см)</text><text x="583.5" y="396.0" fill="#d64545" font-size="12" text-anchor="middle">центр масс посередине, запас 4.7 см</text><text x="757.4" y="171.1" fill="#7b5cc4" font-size="12" text-anchor="middle" font-weight="bold">лапы в воздухе</text><text x="20.0" y="440.0" fill="#12161b" font-size="12.5" text-anchor="start">Две задние лапы — линия, а не опора. Сесть на задний край корпуса нельзя: бедро в 2,5 см от него, колено</text><text x="20.0" y="457.0" fill="#12161b" font-size="12.5" text-anchor="start">гнётся только назад и при поднятом носе уходит в пол (проверено перебором при любом наклоне). Поэтому, как</text><text x="20.0" y="474.0" fill="#12161b" font-size="12.5" text-anchor="start">собака на скакательных суставах, робот садится на колени: голень лежит на полу, колени и задние стопы дают</text><text x="20.0" y="491.0" fill="#12161b" font-size="12.5" text-anchor="start">прямоугольник опоры 9 × 23 см. Порядок: задние лапы по одной вперёд (корпус над тремя другими) → колени на пол,</text><text x="20.0" y="508.0" fill="#12161b" font-size="12.5" text-anchor="start">бёдра ещё впереди колен, центр масс над четырьмя лапами → откинуться на 20° (передние лапы ещё достают до пола,</text><text x="20.0" y="525.0" fill="#12161b" font-size="12.5" text-anchor="start">центр масс уходит на середину опоры) → лапы вверх, 30°, помахать → всё обратно. ~30 с.</text><text x="20.0" y="542.0" fill="#12161b" font-size="12.5" text-anchor="start">Колени касаются пола: на колене не должно быть тяги или качалки, которые упрутся (DEPLOYMENT.md).</text></svg>
