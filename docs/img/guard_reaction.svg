<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
 <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12161b"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20.0" y="28.0" fill="#12161b" font-size="15" text-anchor="start" font-weight="bold">Реакция на препятствие (dog_perception → locomotion): высота уступа решает, как идти</text><text x="20.0" y="60.0" fill="#12161b" font-size="13" text-anchor="start" font-weight="bold">А. Высота уступа (перепад на 3–6 см пути, по лидарам и карте высот)</text><text x="20.0" y="102.0" fill="#12161b" font-size="13" text-anchor="start" font-weight="bold">вверх</text><rect x="150.0" y="80" width="106.5" height="34" fill="#e9edf2" opacity="0.85"/><text x="203.2" y="102.0" fill="#12161b" font-size="12" text-anchor="middle" font-weight="bold">ровно</text><rect x="256.5" y="80" width="71.0" height="34" fill="#3f9a5b" opacity="0.85"/><text x="292.0" y="102.0" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">рысь</text><rect x="327.5" y="80" width="319.5" height="34" fill="#7b5cc4" opacity="0.85"/><text x="487.2" y="102.0" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">ползание: три опоры</text><rect x="647.0" y="80" width="213.0" height="34" fill="#d64545" opacity="0.85"/><text x="753.5" y="102.0" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">стоп → объезд</text><text x="256.5" y="130.0" fill="#8791a0" font-size="11" text-anchor="middle">15 мм</text><text x="327.5" y="130.0" fill="#8791a0" font-size="11" text-anchor="middle">25 мм</text><text x="647.0" y="130.0" fill="#8791a0" font-size="11" text-anchor="middle">70 мм</text><text x="20.0" y="160.0" fill="#12161b" font-size="13" text-anchor="start" font-weight="bold">вниз</text><rect x="150.0" y="138" width="106.5" height="34" fill="#e9edf2" opacity="0.85"/><text x="203.2" y="160.0" fill="#12161b" font-size="12" text-anchor="middle" font-weight="bold">ровно</text><rect x="256.5" y="138" width="142.0" height="34" fill="#3f9a5b" opacity="0.85"/><text x="327.5" y="160.0" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">рысь, выс. шаг</text><rect x="398.5" y="138" width="248.5" height="34" fill="#7b5cc4" opacity="0.85"/><text x="522.8" y="160.0" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">ползание: три опоры</text><rect x="647.0" y="138" width="213.0" height="34" fill="#d64545" opacity="0.85"/><text x="753.5" y="160.0" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">стоп → объезд</text><text x="256.5" y="188.0" fill="#8791a0" font-size="11" text-anchor="middle">15 мм</text><text x="398.5" y="188.0" fill="#8791a0" font-size="11" text-anchor="middle">35 мм</text><text x="647.0" y="188.0" fill="#8791a0" font-size="11" text-anchor="middle">70 мм</text><text x="20.0" y="218.0" fill="#12161b" font-size="12.5" text-anchor="start">Рысь: высокий шаг (до 30 мм) — только у той ноги, перед которой уступ. Выше 25 мм вверх или 35 мм вниз —</text><text x="20.0" y="235.0" fill="#12161b" font-size="12.5" text-anchor="start">ползание: одна нога в воздухе, корпус заранее над треугольником остальных трёх, опоры по карте высот</text><text x="20.0" y="252.0" fill="#12161b" font-size="12.5" text-anchor="start">не ближе 4,5 см к кромке, подъём ноги над препятствием + 3 см. Выше 70 мм — стоп; узкое препятствие</text><text x="20.0" y="269.0" fill="#12161b" font-size="12.5" text-anchor="start">(нужный сдвиг ≤ 0,6 м) робот обходит, широкое (стена) — ждёт оператора. До 15 мм — не реагирует.</text><text x="20.0" y="312.0" fill="#12161b" font-size="13" text-anchor="start" font-weight="bold">Б. По пути к кромке: где центр корпуса относительно кромки, м</text><line x1="60" y1="502" x2="617.6" y2="502" stroke="#12161b" stroke-width="2.5"/><line x1="617.6" y1="502" x2="617.6" y2="472" stroke="#12161b" stroke-width="2.5"/><line x1="617.6" y1="472" x2="860" y2="472" stroke="#12161b" stroke-width="2.5"/><text x="623.6" y="466.0" fill="#12161b" font-size="12" text-anchor="start">кромка</text><rect x="132.7" y="336" width="266.7" height="24" fill="#c9a227" opacity="0.85"/><text x="266.1" y="353.0" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">кромка видна: медленно 0.08 м/с</text><rect x="399.4" y="368" width="363.6" height="24" fill="#7b5cc4" opacity="0.85"/><text x="581.2" y="385.0" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">ползание (25–70 мм)</text><rect x="132.7" y="400" width="339.4" height="24" fill="#d64545" opacity="0.85"/><text x="302.4" y="417.0" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">выше 70 мм: подход и стоп в 0.30 м</text><line x1="472.1" y1="400" x2="472.1" y2="502" stroke="#d64545" stroke-dasharray="4 3"/><line x1="132.7" y1="506" x2="132.7" y2="514" stroke="#8791a0"/><text x="132.7" y="528.0" fill="#8791a0" font-size="11" text-anchor="middle">−1.00</text><line x1="399.4" y1="506" x2="399.4" y2="514" stroke="#8791a0"/><text x="399.4" y="528.0" fill="#8791a0" font-size="11" text-anchor="middle">−0.45</text><line x1="472.1" y1="506" x2="472.1" y2="514" stroke="#8791a0"/><text x="472.1" y="528.0" fill="#8791a0" font-size="11" text-anchor="middle">−0.30</text><line x1="617.6" y1="506" x2="617.6" y2="514" stroke="#8791a0"/><text x="617.6" y="528.0" fill="#8791a0" font-size="11" text-anchor="middle">0</text><line x1="763.0" y1="506" x2="763.0" y2="514" stroke="#8791a0"/><text x="763.0" y="528.0" fill="#8791a0" font-size="11" text-anchor="middle">+0.30</text><rect x="213.9" y="444" width="80" height="18" rx="3" fill="#3b4452"/><line x1="223.9" y1="462" x2="217.9" y2="500" stroke="#d9892b" stroke-width="5"/><line x1="283.9" y1="462" x2="277.9" y2="500" stroke="#d9892b" stroke-width="5"/><line x1="303.9" y1="453.0" x2="363.9" y2="453.0" stroke="#12161b" stroke-width="2.2" marker-end="url(#k)"/><text x="20.0" y="550.0" fill="#12161b" font-size="12.5" text-anchor="start">Ползание держится, пока в окне есть любая кромка: на лестнице следующая ступень, увиденная с проступи,</text><text x="20.0" y="567.0" fill="#12161b" font-size="12.5" text-anchor="start">может казаться ниже — рысь между ступенями не возвращается. Походка меняется только на месте, когда</text><text x="20.0" y="584.0" fill="#12161b" font-size="12.5" text-anchor="start">все лапы на одном уровне; задняя граница окна (+0.30) — задние лапы уже за кромкой.</text><text x="20.0" y="640.0" fill="#12161b" font-size="13" text-anchor="start" font-weight="bold">В. Обход узкого высокого препятствия (вид сверху, робот идёт вправо)</text><rect x="430" y="724" width="40" height="52" fill="#d64545" opacity="0.85"/><text x="450.0" y="794.0" fill="#d64545" font-size="11" text-anchor="middle">выше 70 мм</text><line x1="80" y1="750" x2="840" y2="750" stroke="#8791a0" stroke-dasharray="6 4"/><polyline points="80,750 290,750 340,680 560,680 610,750 840,750" fill="none" stroke="#2f8fb5" stroke-width="3"/><line x1="820.0" y1="750.0" x2="845.0" y2="750.0" stroke="#2f8fb5" stroke-width="2.2" marker-end="url(#k)"/><text x="250.0" y="700.0" fill="#2f8fb5" font-size="12" text-anchor="end" font-weight="bold">стоп, в сторону</text><text x="250.0" y="715.0" fill="#2f8fb5" font-size="12" text-anchor="end">на 0.06 м/с</text><text x="450.0" y="670.0" fill="#2f8fb5" font-size="12" text-anchor="middle" font-weight="bold">держит смещение, пока препятствие не позади</text><text x="650.0" y="700.0" fill="#2f8fb5" font-size="12" text-anchor="start" font-weight="bold">назад на свою</text><text x="650.0" y="715.0" fill="#2f8fb5" font-size="12" text-anchor="start">линию</text><line x1="760.0" y1="750.0" x2="760.0" y2="680.0" stroke="#2a78d6" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/><text x="0.0" y="0.0" fill="#2a78d6" font-weight="bold" text-anchor="middle"></text><text x="770.0" y="710.0" fill="#2a78d6" font-size="11" text-anchor="start">½ ширины</text><text x="770.0" y="724.0" fill="#2a78d6" font-size="11" text-anchor="start">+ 0.20 + 0.06 м</text></svg>
