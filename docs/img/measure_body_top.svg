<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
 <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12161b"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20.0" y="28.0" fill="#12161b" font-size="15" text-anchor="start" font-weight="bold">Корпус сверху: «вперёд» — вправо, левый бок — вверху</text><rect x="155" y="160" width="350" height="100" rx="6" fill="#3b4452" opacity="0.15" stroke="#3b4452"/><line x1="450" y1="140" x2="510" y2="140" stroke="#555" stroke-width="3" stroke-dasharray="6 3"/><circle cx="480" cy="140" r="6" fill="#12161b"/><text x="492.0" y="128.0" fill="#12161b" font-size="13" text-anchor="start" font-weight="bold">LF</text><line x1="450" y1="280" x2="510" y2="280" stroke="#555" stroke-width="3" stroke-dasharray="6 3"/><circle cx="480" cy="280" r="6" fill="#12161b"/><text x="492.0" y="300.0" fill="#12161b" font-size="13" text-anchor="start" font-weight="bold">RF</text><line x1="150" y1="140" x2="210" y2="140" stroke="#555" stroke-width="3" stroke-dasharray="6 3"/><circle cx="180" cy="140" r="6" fill="#12161b"/><text x="168.0" y="128.0" fill="#12161b" font-size="13" text-anchor="end" font-weight="bold">LR</text><line x1="150" y1="280" x2="210" y2="280" stroke="#555" stroke-width="3" stroke-dasharray="6 3"/><circle cx="180" cy="280" r="6" fill="#12161b"/><text x="168.0" y="300.0" fill="#12161b" font-size="13" text-anchor="end" font-weight="bold">RR</text><circle cx="330" cy="210" r="5" fill="#eb6834"/><text x="338.0" y="230.0" fill="#eb6834" font-size="13" text-anchor="start" font-weight="bold">центр корпуса</text><line x1="330" y1="210" x2="400" y2="210" stroke="#12161b" stroke-width="2" marker-end="url(#k)"/><text x="406.0" y="214.0" fill="#12161b" font-size="13" text-anchor="start">x</text><line x1="330" y1="210" x2="330" y2="150" stroke="#12161b" stroke-width="2" marker-end="url(#k)"/><text x="335.0" y="148.0" fill="#12161b" font-size="13" text-anchor="start">y</text><line x1="480" y1="140" x2="480" y2="328" stroke="#8791a0" stroke-dasharray="4 3"/><line x1="330" y1="210" x2="330" y2="328" stroke="#8791a0" stroke-dasharray="4 3"/><line x1="330.0" y1="320.0" x2="480.0" y2="320.0" stroke="#2a78d6" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/><text x="405.0" y="314.0" fill="#2a78d6" font-weight="bold" text-anchor="middle">hip_x</text><line x1="480" y1="140" x2="556" y2="140" stroke="#8791a0" stroke-dasharray="4 3"/><line x1="330" y1="210" x2="556" y2="210" stroke="#8791a0" stroke-dasharray="4 3"/><line x1="546.0" y1="210.0" x2="546.0" y2="140.0" stroke="#2a78d6" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/><text x="554.0" y="175.0" fill="#2a78d6" font-weight="bold" text-anchor="start">hip_y</text><text x="20.0" y="380.0" fill="#12161b" font-size="12" text-anchor="start">● — точка, где ось бедра пересекает ось отведения (пунктир вдоль корпуса).</text><text x="20.0" y="397.0" fill="#12161b" font-size="12" text-anchor="start">Центр корпуса — середина между этими четырьмя точками; от него же меряются датчики.</text><text x="20.0" y="414.0" fill="#12161b" font-size="12" text-anchor="start">hip_x — от центра до передних (и задних) точек вдоль корпуса = половина расстояния перёд–зад.</text><text x="20.0" y="431.0" fill="#12161b" font-size="12" text-anchor="start">hip_y — от центра до оси отведения поперёк = половина расстояния лево–право.</text><text x="20.0" y="448.0" fill="#12161b" font-size="12" text-anchor="start">Датчики (sensors.* в robot.yaml): x вперёд, y влево, z вверх от центра; z = 0 на высоте оси бедра.</text></svg>
