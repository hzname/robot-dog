<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
 <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12161b"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20.0" y="28.0" fill="#12161b" font-size="15" text-anchor="start" font-weight="bold">IMU: что писать в axes (config/imu.yaml). Вид сверху, «вперёд» — вправо</text><line x1="600" y1="56" x2="670" y2="56" stroke="#12161b" stroke-width="2" marker-end="url(#k)"/><text x="635.0" y="48.0" fill="#12161b" font-size="13" text-anchor="middle">вперёд</text><rect x="80" y="110" width="100" height="80" rx="4" fill="#2f6f3e" opacity="0.85"/><text x="130.0" y="214.0" fill="#12161b" font-size="13" text-anchor="middle" font-weight="bold">X вперёд, Y влево</text><text x="130" y="234" fill="#2a78d6" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans Mono, monospace">axes: "x,y,z"</text><line x1="130" y1="150" x2="170" y2="150" stroke="#fff" stroke-width="3" marker-end="url(#k)"/><text x="182.0" y="155.0" fill="#12161b" font-size="13" text-anchor="middle" font-weight="bold">X</text><line x1="130" y1="150" x2="130" y2="120" stroke="#fff" stroke-width="3" marker-end="url(#k)"/><text x="130.0" y="116.0" fill="#12161b" font-size="13" text-anchor="middle" font-weight="bold">Y</text><rect x="300" y="110" width="100" height="80" rx="4" fill="#2f6f3e" opacity="0.85"/><text x="350.0" y="214.0" fill="#12161b" font-size="13" text-anchor="middle" font-weight="bold">X влево, Y назад</text><text x="350" y="234" fill="#2a78d6" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans Mono, monospace">axes: "-y,x,z"</text><line x1="350" y1="150" x2="350" y2="120" stroke="#fff" stroke-width="3" marker-end="url(#k)"/><text x="350.0" y="116.0" fill="#12161b" font-size="13" text-anchor="middle" font-weight="bold">X</text><line x1="350" y1="150" x2="310" y2="150" stroke="#fff" stroke-width="3" marker-end="url(#k)"/><text x="298.0" y="155.0" fill="#12161b" font-size="13" text-anchor="middle" font-weight="bold">Y</text><rect x="520" y="110" width="100" height="80" rx="4" fill="#2f6f3e" opacity="0.85"/><text x="570.0" y="214.0" fill="#12161b" font-size="13" text-anchor="middle" font-weight="bold">X вправо, Y вперёд</text><text x="570" y="234" fill="#2a78d6" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans Mono, monospace">axes: "y,-x,z"</text><line x1="570" y1="150" x2="570" y2="180" stroke="#fff" stroke-width="3" marker-end="url(#k)"/><text x="570.0" y="194.0" fill="#12161b" font-size="13" text-anchor="middle" font-weight="bold">X</text><line x1="570" y1="150" x2="610" y2="150" stroke="#fff" stroke-width="3" marker-end="url(#k)"/><text x="622.0" y="155.0" fill="#12161b" font-size="13" text-anchor="middle" font-weight="bold">Y</text><text x="20.0" y="320.0" fill="#12161b" font-size="12" text-anchor="start">Стрелки X/Y напечатаны на плате MPU6050; плата горизонтально, компонентами вверх (z вверх).</text><text x="20.0" y="337.0" fill="#12161b" font-size="12" text-anchor="start">"a,b,c": ось x корпуса = ось a датчика, y корпуса = b, z корпуса = c (со знаком).</text><text x="20.0" y="354.0" fill="#12161b" font-size="12" text-anchor="start">Проверка: нос вниз → тангаж +; левый бок вверх → крен +; поворот против часовой → ω_z +.</text></svg>
