<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
 <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12161b"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20.0" y="28.0" fill="#12161b" font-size="15" text-anchor="start" font-weight="bold">Нога сзади: смотрим на робота СЗАДИ, его левый бок — слева</text><rect x="300" y="95" width="120" height="50" rx="4" fill="#3b4452" opacity="0.9"/><text x="360.0" y="125.0" fill="#fff" font-size="13" text-anchor="middle">корпус</text><line x1="360" y1="55" x2="360" y2="390" stroke="#8791a0" stroke-dasharray="8 4"/><text x="366.0" y="345.0" fill="#8791a0" font-size="13" text-anchor="start">середина корпуса</text><line x1="270" y1="120" x2="210" y2="120" stroke="#555" stroke-width="10" stroke-linecap="round"/><circle cx="270.0" cy="120.0" r="9" fill="#fff" stroke="#12161b" stroke-width="2"/><circle cx="270.0" cy="120.0" r="2" fill="#12161b"/><text x="284.0" y="166.0" fill="#12161b" font-size="12" text-anchor="start">ось отведения hip</text><text x="284.0" y="181.0" fill="#12161b" font-size="12" text-anchor="start">(вдоль корпуса, на нас)</text><line x1="210" y1="120" x2="210" y2="340" stroke="#d9892b" stroke-width="12" stroke-linecap="round"/><circle cx="210" cy="348" r="10" fill="#333"/><line x1="210" y1="66" x2="210" y2="106" stroke="#8791a0" stroke-dasharray="4 3"/><line x1="270" y1="66" x2="270" y2="106" stroke="#8791a0" stroke-dasharray="4 3"/><line x1="360" y1="66" x2="360" y2="106" stroke="#8791a0" stroke-dasharray="4 3"/><line x1="270.0" y1="76.0" x2="360.0" y2="76.0" stroke="#2a78d6" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/><text x="315.0" y="70.0" fill="#2a78d6" font-weight="bold" text-anchor="middle">hip_y</text><line x1="210.0" y1="96.0" x2="270.0" y2="96.0" stroke="#2a78d6" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/><text x="202.0" y="92.0" fill="#2a78d6" font-weight="bold" text-anchor="end">hip_offset</text><text x="196.0" y="240.0" fill="#12161b" font-size="12" text-anchor="end">плоскость, в которой</text><text x="196.0" y="255.0" fill="#12161b" font-size="12" text-anchor="end">ходят бедро и голень</text><line x1="60" y1="358" x2="640" y2="358" stroke="#8791a0" stroke-width="2"/><path d="M212,310 A 190 190 0 0 1 165,302" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#o)"/><text x="158.0" y="292.0" fill="#eb6834" font-size="13" text-anchor="end" font-weight="bold">угол hip «+»</text><text x="158.0" y="307.0" fill="#eb6834" font-size="12" text-anchor="end">стопа влево</text><line x1="640" y1="110" x2="580" y2="110" stroke="#12161b" stroke-width="2" marker-end="url(#k)"/><text x="610.0" y="102.0" fill="#12161b" font-size="13" text-anchor="middle">влево (y)</text><text x="20.0" y="388.0" fill="#12161b" font-size="12.5" text-anchor="start">hip_y — от середины корпуса до оси отведения = половина расстояния между осями</text><text x="20.0" y="405.0" fill="#12161b" font-size="12.5" text-anchor="start">        отведения левой и правой ноги.</text><text x="20.0" y="422.0" fill="#12161b" font-size="12.5" text-anchor="start">hip_offset — от оси отведения до средней плоскости бедра и голени.</text><text x="20.0" y="439.0" fill="#12161b" font-size="12.5" text-anchor="start">В модели ось отведения и ось бедра на одной высоте. Если они разнесены по высоте</text><text x="20.0" y="456.0" fill="#12161b" font-size="12.5" text-anchor="start">больше чем на 5 мм — запишите это число: модель придётся дополнить.</text></svg>
