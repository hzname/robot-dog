<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
 <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12161b"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20.0" y="28.0" fill="#12161b" font-size="15" text-anchor="start" font-weight="bold">Нога сбоку: смотрим на ЛЕВЫЙ бок робота, «вперёд» — вправо</text><rect x="230" y="90" width="260" height="46" rx="4" fill="#3b4452" opacity="0.9"/><text x="430.0" y="110.0" fill="#fff" font-size="13" text-anchor="start">корпус</text><line x1="120" y1="343.96698722877983" x2="600" y2="343.96698722877983" stroke="#8791a0" stroke-width="2"/><text x="565.0" y="362.0" fill="#8791a0" font-size="13" text-anchor="start">пол</text><line x1="330" y1="120" x2="225.8" y2="227.9" stroke="#d9892b" stroke-width="12" stroke-linecap="round"/><line x1="225.8" y1="227.9" x2="331.9" y2="334.0" stroke="#d9892b" stroke-width="9" stroke-linecap="round"/><circle cx="331.9" cy="334.0" r="10" fill="#333"/><circle cx="330.0" cy="120.0" r="9" fill="#fff" stroke="#12161b" stroke-width="2"/><circle cx="330.0" cy="120.0" r="2" fill="#12161b"/><circle cx="225.8" cy="227.9" r="8" fill="#fff" stroke="#12161b" stroke-width="2"/><circle cx="225.8" cy="227.9" r="2" fill="#12161b"/><text x="344.0" y="150.0" fill="#12161b" font-size="13" text-anchor="start">ось бедра (вал сервы thigh)</text><text x="209.8" y="231.9" fill="#12161b" font-size="13" text-anchor="end">ось колена</text><text x="347.9" y="338.0" fill="#12161b" font-size="13" text-anchor="start">точка касания</text><line x1="312.7" y1="103.3" x2="208.5" y2="211.2" stroke="#2a78d6" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/><text x="239.9" y="160.0" fill="#2a78d6" font-weight="bold" text-anchor="end">thigh</text><line x1="239.9" y1="213.8" x2="346.0" y2="329.8" stroke="#2a78d6" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/><text x="314.8" y="290.9" fill="#2a78d6" font-weight="bold" text-anchor="start">calf</text><line x1="330" y1="120" x2="535" y2="120" stroke="#8791a0" stroke-dasharray="4 3"/><line x1="525.0" y1="120.0" x2="525.0" y2="344.0" stroke="#2a78d6" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/><text x="533.0" y="232.0" fill="#2a78d6" font-weight="bold" text-anchor="start">stand_height</text><line x1="330" y1="120" x2="330" y2="220" stroke="#8791a0" stroke-dasharray="5 4"/><path d="M330,182 A62,62 0 0,1 286.9,164.6" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#o)"/><text x="338.0" y="204.0" fill="#eb6834" font-size="13" text-anchor="start" font-weight="bold">угол thigh ≈ +44° в стойке</text><line x1="225.8" y1="227.9" x2="184.1" y2="271.1" stroke="#8791a0" stroke-dasharray="5 4"/><path d="M196.6,258.1 A42,42 0 0,0 255.5,257.6" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#o)"/><text x="195.8" y="305.9" fill="#eb6834" font-size="13" text-anchor="end" font-weight="bold">угол calf ≈ −89° в стойке</text><line x1="590" y1="62" x2="660" y2="62" stroke="#12161b" stroke-width="2" marker-end="url(#k)"/><text x="625.0" y="54.0" fill="#12161b" font-size="13" text-anchor="middle">вперёд (x)</text><text x="20.0" y="412.0" fill="#12161b" font-size="12.5" text-anchor="start">thigh — от центра оси бедра до центра оси колена, по прямой.</text><text x="20.0" y="429.0" fill="#12161b" font-size="12.5" text-anchor="start">calf — от центра оси колена до точки касания стопы с полом.</text><text x="20.0" y="446.0" fill="#12161b" font-size="12.5" text-anchor="start">stand_height — от оси бедра до пола в стойке (задаётся в конфиге, не мерится).</text><text x="20.0" y="463.0" fill="#12161b" font-size="12.5" text-anchor="start">Нули: thigh 0 = бедро вертикально вниз, «+» = стопа уходит назад;</text><text x="20.0" y="480.0" fill="#12161b" font-size="12.5" text-anchor="start">calf 0 = нога прямая, «−» = колено согнуто назад (−90° = прямой угол).</text></svg>
