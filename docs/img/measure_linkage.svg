<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
 <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12161b"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20.0" y="28.0" fill="#12161b" font-size="15" text-anchor="start" font-weight="bold">Тяга (сустав не на валу сервы): серва на ЦЕНТРАЛЬНОМ импульсе</text><line x1="200" y1="230" x2="460" y2="230" stroke="#8791a0" stroke-dasharray="6 4"/><line x1="200" y1="230" x2="200" y2="130" stroke="#555" stroke-width="9" stroke-linecap="round"/><line x1="460" y1="230" x2="460" y2="140" stroke="#d9892b" stroke-width="9" stroke-linecap="round"/><line x1="200" y1="130" x2="460" y2="140" stroke="#12161b" stroke-width="4"/><circle cx="200" cy="130" r="6" fill="#fff" stroke="#12161b" stroke-width="2"/><circle cx="460" cy="140" r="6" fill="#fff" stroke="#12161b" stroke-width="2"/><circle cx="200.0" cy="230.0" r="10" fill="#fff" stroke="#12161b" stroke-width="2"/><circle cx="200.0" cy="230.0" r="2" fill="#12161b"/><circle cx="460.0" cy="230.0" r="10" fill="#fff" stroke="#12161b" stroke-width="2"/><circle cx="460.0" cy="230.0" r="2" fill="#12161b"/><text x="200.0" y="264.0" fill="#12161b" font-size="13" text-anchor="middle">ось (вал) сервы</text><text x="460.0" y="264.0" fill="#12161b" font-size="13" text-anchor="middle">ось сустава</text><line x1="200.0" y1="282.0" x2="460.0" y2="282.0" stroke="#2a78d6" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/><text x="330.0" y="276.0" fill="#2a78d6" font-weight="bold" text-anchor="middle">axis_distance_mm</text><line x1="174.0" y1="230.0" x2="174.0" y2="130.0" stroke="#2a78d6" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/><text x="166.0" y="184.0" fill="#2a78d6" font-weight="bold" text-anchor="end">servo_arm_mm</text><line x1="486.0" y1="230.0" x2="486.0" y2="140.0" stroke="#2a78d6" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/><text x="494.0" y="188.0" fill="#2a78d6" font-weight="bold" text-anchor="start">joint_arm_mm</text><line x1="200.0" y1="106.0" x2="460.0" y2="116.0" stroke="#2a78d6" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/><text x="330.0" y="105.0" fill="#2a78d6" font-weight="bold" text-anchor="middle">rod_mm</text><path d="M224,230 A24,24 0 0,0 200,206" fill="none" stroke="#eb6834" stroke-width="2"/><text x="230.0" y="214.0" fill="#eb6834" font-size="12" text-anchor="start">90° на центре</text><text x="20.0" y="364.0" fill="#12161b" font-size="12" text-anchor="start">Все длины — между центрами осей и шарниров. servo_arm_mm = 0 — серва прямо на оси сустава.</text><text x="20.0" y="381.0" fill="#12161b" font-size="12" text-anchor="start">joint_arm_mm = 0 — рычаг сустава такой же, как у сервы; rod_mm = 0 — тяга = axis_distance_mm.</text><text x="20.0" y="398.0" fill="#12161b" font-size="12" text-anchor="start">На центральном импульсе рычаг сервы ⟂ линии «ось сервы — ось сустава».</text><text x="20.0" y="415.0" fill="#12161b" font-size="12" text-anchor="start">Колено тянется от корпуса через бедро? Тогда coupled_to: &lt;нога&gt;_thigh_joint (CALIBRATION.md).</text></svg>
