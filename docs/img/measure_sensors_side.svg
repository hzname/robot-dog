<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
 <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12161b"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20.0" y="28.0" fill="#12161b" font-size="15" text-anchor="start" font-weight="bold">Датчики сбоку: левый бок, «вперёд» — вправо; z — от высоты осей бедра</text><rect x="146" y="123" width="207" height="54" rx="5" fill="#3b4452" opacity="0.13" stroke="#3b4452"/><line x1="40" y1="285.0" x2="770" y2="285.0" stroke="#8791a0" stroke-width="2"/><text x="740.0" y="303.0" fill="#8791a0" font-size="13" text-anchor="start">пол</text><line x1="60" y1="150" x2="520.0" y2="150" stroke="#8791a0" stroke-dasharray="5 4"/><text x="64.0" y="144.0" fill="#8791a0" font-size="12" text-anchor="start">z = 0: оси бедра</text><circle cx="331.0" cy="150.0" r="7" fill="#fff" stroke="#12161b" stroke-width="2"/><circle cx="331.0" cy="150.0" r="2" fill="#12161b"/><circle cx="169.0" cy="150.0" r="7" fill="#fff" stroke="#12161b" stroke-width="2"/><circle cx="169.0" cy="150.0" r="2" fill="#12161b"/><line x1="106.0" y1="150.0" x2="106.0" y2="285.0" stroke="#2a78d6" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/><text x="100.0" y="237.5" fill="#2a78d6" font-weight="bold" text-anchor="end">stand_height</text><rect x="348.5" y="145.0" width="10" height="10" fill="#eb6834"/><line x1="353.5" y1="150.0" x2="514.4" y2="285.0" stroke="#eb6834" stroke-width="2.2" marker-end="url(#o)"/><line x1="353.5" y1="150.0" x2="483.5" y2="150.0" stroke="#8791a0" stroke-dasharray="3 3"/><path d="M423.5,150.0 A70,70 0 0,1 407.1,195.0" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#o)"/><text x="373.5" y="305.0" fill="#eb6834" font-size="12" text-anchor="start" font-weight="bold">40°: pitch FL, FR, RC, GS2</text><text x="520.4" y="277.0" fill="#eb6834" font-size="12" text-anchor="start">FL / GS2 на полу</text><rect x="348.5" y="126.2" width="10" height="10" fill="#eb6834"/><line x1="353.5" y1="131.2" x2="754.1" y2="285.0" stroke="#eb6834" stroke-width="1.6" marker-end="url(#o)"/><text x="664.0" y="226.5" fill="#eb6834" font-size="12" text-anchor="start" font-weight="bold">FC: 20°</text><line x1="339.5" y1="150.0" x2="339.5" y2="285.0" stroke="#2a78d6" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/><text x="333.5" y="255.0" fill="#2a78d6" font-weight="bold" text-anchor="end">над полом: stand_height + z</text><circle cx="340.0" cy="94.2" r="11" fill="#fff" stroke="#2a78d6" stroke-width="2.5"/><line x1="262.1" y1="49.2" x2="625.8" y2="259.2" stroke="#2a78d6" stroke-width="2" stroke-dasharray="8 4"/><line x1="340.0" y1="94.2" x2="480.0" y2="94.2" stroke="#8791a0" stroke-dasharray="3 3"/><path d="M450.0,94.2 A110,110 0 0,1 435.3,149.2" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#o)"/><text x="456.0" y="130.2" fill="#2a78d6" font-size="12" text-anchor="start" font-weight="bold">α = 30°: x_lidar_tilt_deg</text><line x1="304.0" y1="150.0" x2="304.0" y2="94.2" stroke="#2a78d6" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/><text x="298.0" y="126.1" fill="#2a78d6" font-weight="bold" text-anchor="end">x_lidar_z</text><text x="20.0" y="390.0" fill="#12161b" font-size="12" text-anchor="start">z — вверх от высоты осей бедра (их высота над полом = stand_height), ниже — с минусом.</text><text x="20.0" y="407.0" fill="#12161b" font-size="12" text-anchor="start">pitch (наклон) — угол луча вниз от горизонтали корпуса: + вниз. Меряйте угломером по кронштейну</text><text x="20.0" y="424.0" fill="#12161b" font-size="12" text-anchor="start">на ровном столе, корпус горизонтально. α лидара — наклон плоскости скана, в направлении β (вид сверху).</text><text x="20.0" y="441.0" fill="#12161b" font-size="12" text-anchor="start">Где всё это ляжет на пол, robot_setup показывает сразу: линия GS2, пятна ToF, крест лидаров.</text></svg>
