<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
 <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12161b"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20.0" y="28.0" fill="#12161b" font-size="15" text-anchor="start" font-weight="bold">Датчики сверху: «вперёд» — вправо, левый бок — вверху. x, y — от центра корпуса</text><rect x="174" y="184" width="253" height="132" rx="6" fill="#3b4452" opacity="0.13" stroke="#3b4452"/><circle cx="399.0" cy="123.5" r="5" fill="#8791a0"/><circle cx="399.0" cy="376.5" r="5" fill="#8791a0"/><circle cx="201.0" cy="123.5" r="5" fill="#8791a0"/><circle cx="201.0" cy="376.5" r="5" fill="#8791a0"/><text x="201.0" y="113.5" fill="#8791a0" font-size="11" text-anchor="middle">стопы</text><circle cx="300" cy="250" r="5" fill="#eb6834"/><line x1="300.0" y1="250.0" x2="360.0" y2="250.0" stroke="#12161b" stroke-width="2" marker-end="url(#k)"/><text x="364.0" y="254.0" fill="#12161b" font-size="13" text-anchor="start">x</text><line x1="300.0" y1="250.0" x2="300.0" y2="200.0" stroke="#12161b" stroke-width="2" marker-end="url(#k)"/><text x="305.0" y="198.0" fill="#12161b" font-size="13" text-anchor="start">y</text><text x="292.0" y="268.0" fill="#eb6834" font-size="13" text-anchor="end" font-weight="bold">центр</text><circle cx="410.0" cy="206.0" r="11" fill="#fff" stroke="#2a78d6" stroke-width="2.5"/><text x="410.0" y="210.0" fill="#2a78d6" font-size="11" text-anchor="middle" font-weight="bold">L</text><line x1="410.0" y1="206.0" x2="463.6" y2="251.0" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#a)"/><circle cx="410.0" cy="294.0" r="11" fill="#fff" stroke="#2a78d6" stroke-width="2.5"/><text x="410.0" y="298.0" fill="#2a78d6" font-size="11" text-anchor="middle" font-weight="bold">R</text><line x1="410.0" y1="294.0" x2="463.6" y2="249.0" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#a)"/><path d="M456.0,206.0 A46,46 0 0,1 445.2,235.6" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#o)"/><text x="462.0" y="246.0" fill="#2a78d6" font-size="15" text-anchor="start" font-weight="bold">β</text><line x1="300.0" y1="172.0" x2="410.0" y2="172.0" stroke="#2a78d6" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/><text x="355.0" y="166.0" fill="#2a78d6" font-weight="bold" text-anchor="middle">x_lidar_x</text><line x1="410.0" y1="166.0" x2="410.0" y2="196.0" stroke="#8791a0" stroke-dasharray="3 3"/><line x1="267.0" y1="250.0" x2="267.0" y2="206.0" stroke="#2a78d6" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/><text x="261.0" y="232.0" fill="#2a78d6" font-weight="bold" text-anchor="end">x_lidar_y</text><line x1="267.0" y1="206.0" x2="410.0" y2="206.0" stroke="#8791a0" stroke-dasharray="3 3"/><rect x="421.5" y="195.5" width="10" height="10" fill="#eb6834"/><line x1="426.5" y1="200.5" x2="537.0" y2="153.6" stroke="#eb6834" stroke-width="2.2" marker-end="url(#o)"/><text x="544.3" y="144.5" fill="#eb6834" font-size="13" text-anchor="start" font-weight="bold">FL</text><rect x="421.5" y="294.5" width="10" height="10" fill="#eb6834"/><line x1="426.5" y1="299.5" x2="537.0" y2="346.4" stroke="#eb6834" stroke-width="2.2" marker-end="url(#o)"/><text x="544.3" y="363.5" fill="#eb6834" font-size="13" text-anchor="start" font-weight="bold">FR</text><rect x="421.5" y="245.0" width="10" height="10" fill="#eb6834"/><line x1="426.5" y1="250.0" x2="546.5" y2="250.0" stroke="#eb6834" stroke-width="2.2" marker-end="url(#o)"/><text x="554.5" y="254.0" fill="#eb6834" font-size="13" text-anchor="start" font-weight="bold">FC / GS2</text><line x1="426.5" y1="200.5" x2="576.5" y2="200.5" stroke="#8791a0" stroke-dasharray="3 3"/><path d="M516.5,200.5 A90,90 0 0,0 509.3,165.3" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#o)"/><text x="522.5" y="180.5" fill="#eb6834" font-size="12" text-anchor="start">23°: yaw FL</text><line x1="426.5" y1="250" x2="522.9" y2="364.9" stroke="#7a3fc4" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="426.5" y1="250" x2="522.9" y2="135.1" stroke="#7a3fc4" stroke-width="1.5" stroke-dasharray="6 4"/><text x="576.5" y="378.0" fill="#7a3fc4" font-size="12" text-anchor="start">веер GS2 100°</text><rect x="168.5" y="245.0" width="10" height="10" fill="#eb6834"/><line x1="173.5" y1="250.0" x2="83.5" y2="250.0" stroke="#eb6834" stroke-width="2.2" marker-end="url(#o)"/><text x="83.5" y="272.0" fill="#eb6834" font-size="13" text-anchor="start" font-weight="bold">RC: yaw 180°</text><line x1="300.0" y1="360.0" x2="426.5" y2="360.0" stroke="#2a78d6" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/><text x="363.2" y="354.0" fill="#2a78d6" font-weight="bold" text-anchor="middle">tof_x / gs2_x</text><line x1="426.5" y1="299.5" x2="426.5" y2="364.0" stroke="#8791a0" stroke-dasharray="3 3"/><line x1="396.5" y1="250.0" x2="396.5" y2="200.5" stroke="#2a78d6" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/><text x="390.5" y="229.8" fill="#2a78d6" font-weight="bold" text-anchor="end">tof_y</text><text x="20.0" y="464.0" fill="#12161b" font-size="12" text-anchor="start">x — вперёд от центра корпуса, y — влево (правые датчики с минусом). Меряйте до окна датчика:</text><text x="20.0" y="481.0" fill="#12161b" font-size="12" text-anchor="start">у VL53L1X — до центра стекла, у GS2 — до центра окна лазера, у лидара — до оси вращения.</text><text x="20.0" y="498.0" fill="#12161b" font-size="12" text-anchor="start">yaw (поворот) — угол луча от «вперёд»: + влево (против часовой сверху). FL +23°, FR −23°, RC 180°.</text><text x="20.0" y="515.0" fill="#12161b" font-size="12" text-anchor="start">β лидаров — куда опущена плоскость скана: левый (L) опускает её вправо-вперёд, правый (R) —</text><text x="20.0" y="532.0" fill="#12161b" font-size="12" text-anchor="start">влево-вперёд, поэтому их линии на полу перекрещиваются. Наклон α — на виде сбоку.</text></svg>
