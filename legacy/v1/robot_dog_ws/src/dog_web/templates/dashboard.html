<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Dog</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav>
    <span class="logo">🐕 RobotDogQwen</span>
    <a href="/dashboard" class="active" data-i18n="nav.dashboard">Панель</a>
    <a href="/control" data-i18n="nav.control">Управление</a>
    <a href="/state" data-i18n="nav.state">Состояние</a>
    <a href="/calibration" data-i18n="nav.calibration">Калибровка</a>
    <span class="status-dot" id="nav-dot"></span>
  </nav>

  <main>
    <!-- Shared status bar with E-Stop buttons -->
    <div class="card">
      <div class="status-bar">
        <div class="status-pill"><span class="dot" id="ws-dot"></span> <span data-i18n="common.ws">WebSocket</span></div>
        <div class="status-pill"><span class="dot" id="ros-dot"></span> <span data-i18n="common.ros">ROS2</span></div>
        <div class="status-pill"><span class="dot" id="servo-dot"></span> <span data-i18n="common.servos">Сервы</span></div>
        <div class="status-pill"><span class="dot" id="estop-dot"></span> <span data-i18n="common.estop">E-Stop</span></div>
        <div class="estop-btns">
          <button class="btn btn-red btn-sm" onclick="api('/api/control/emergency_stop',{stop:true})">🛑 Стоп</button>
          <button class="btn btn-orange btn-sm" onclick="api('/api/control/emergency_stop',{stop:false})">🔓 Снять</button>
        </div>
      </div>
    </div>

    <!-- Joint overview -->
    <div class="card">
      <h2 data-i18n="dash.joints">Позиции суставов</h2>
      <div class="joint-grid" id="joint-overview"></div>
    </div>

    <!-- IMU -->
    <div class="card">
      <h2>📐 IMU Orientation</h2>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
        <div class="imu-card">
          <div class="imu-label">Roll (X)</div>
          <div class="imu-value" id="imu-roll">0.00°</div>
        </div>
        <div class="imu-card">
          <div class="imu-label">Pitch (Y)</div>
          <div class="imu-value" id="imu-pitch">0.00°</div>
        </div>
        <div class="imu-card">
          <div class="imu-label">Yaw (Z)</div>
          <div class="imu-value" id="imu-yaw">0.00°</div>
        </div>
        <div class="imu-card">
          <div class="imu-label">Gyro Z</div>
          <div class="imu-value" id="imu-gyro">0.00 rad/s</div>
        </div>
      </div>
      <div style="margin-top:12px">
        <div style="color:var(--text-dim);font-size:.8em;margin-bottom:4px">Ускорение</div>
        <div style="display:flex;gap:8px;font-family:monospace;font-size:.85em">
          <span style="color:var(--green)">X: <span id="imu-ax">0.00</span></span>
          <span style="color:var(--blue)">Y: <span id="imu-ay">0.00</span></span>
          <span style="color:var(--orange)">Z: <span id="imu-az">0.00</span></span>
        </div>
      </div>
    </div>

    <!-- Quick actions -->
    <div class="card">
      <h2 data-i18n="dash.quick">Быстрые действия</h2>
      <div class="btn-group">
        <button class="btn" onclick="api('/api/control/servo_enable',{enable:true})" data-i18n="dash.servo_on">Включить сервы</button>
        <button class="btn btn-dark" onclick="api('/api/control/servo_enable',{enable:false})" data-i18n="dash.servo_off">Выключить сервы</button>
      </div>
    </div>

    <!-- Log -->
    <div class="card">
      <h2 data-i18n="dash.log">Журнал событий</h2>
      <div id="log" style="font-family:monospace;font-size:.85em;color:var(--text-dim);max-height:150px;overflow-y:auto;"></div>
    </div>
  </main>

  <script src="/static/common.js"></script>
  <script src="/static/i18n.js"></script>
  <script>
    const logEl = document.getElementById('log');
    function log(msg) {
      const t = new Date().toLocaleTimeString();
      logEl.innerHTML = `<div>[${t}] ${msg}</div>` + logEl.innerHTML;
    }

    // Build joint overview
    const jDiv = document.getElementById('joint-overview');
    JOINT_NAMES.forEach(name => {
      jDiv.innerHTML += `<div class="joint-card"><div class="name">${name}</div><div class="value" id="j-${name}">0.00</div><div class="bar-wrap"><div class="bar" id="jb-${name}" style="width:50%"></div></div></div>`;
    });

    // WebSocket
    const ws = new StateWS(state => {
      (state.joint_positions || []).forEach((v, i) => {
        const name = JOINT_NAMES[i];
        const el = document.getElementById('j-' + name);
        const bar = document.getElementById('jb-' + name);
        if (el) el.textContent = v.toFixed(3);
        if (bar) {
          const pct = Math.min(100, Math.max(0, (v + 3.14) / 6.28 * 100));
          bar.style.width = pct + '%';
        }
      });

      // Update IMU data
      if (state.imu_orientation) {
        const o = state.imu_orientation;
        // Convert quaternion to Euler angles (roll, pitch, yaw)
        const roll = Math.atan2(2 * (o.w * o.x + o.y * o.z), 1 - 2 * (o.x * o.x + o.y * o.y));
        const pitch = Math.asin(Math.max(-1, Math.min(1, 2 * (o.w * o.y - o.z * o.x))));
        const yaw = Math.atan2(2 * (o.w * o.z + o.x * o.y), 1 - 2 * (o.y * o.y + o.z * o.z));

        const rollDeg = (roll * 180 / Math.PI).toFixed(2);
        const pitchDeg = (pitch * 180 / Math.PI).toFixed(2);
        const yawDeg = (yaw * 180 / Math.PI).toFixed(2);

        const rollEl = document.getElementById('imu-roll');
        const pitchEl = document.getElementById('imu-pitch');
        const yawEl = document.getElementById('imu-yaw');
        if (rollEl) rollEl.textContent = rollDeg + '°';
        if (pitchEl) pitchEl.textContent = pitchDeg + '°';
        if (yawEl) yawEl.textContent = yawDeg + '°';
      }

      if (state.imu_angular_vel) {
        const gyro = state.imu_angular_vel.z.toFixed(3);
        const gyroEl = document.getElementById('imu-gyro');
        if (gyroEl) gyroEl.textContent = gyro + ' rad/s';
      }

      if (state.imu_acceleration) {
        const ax = document.getElementById('imu-ax');
        const ay = document.getElementById('imu-ay');
        const az = document.getElementById('imu-az');
        if (ax) ax.textContent = state.imu_acceleration.x.toFixed(2);
        if (ay) ay.textContent = state.imu_acceleration.y.toFixed(2);
        if (az) az.textContent = state.imu_acceleration.z.toFixed(2);
      }

      // Status dots
      const rosDot = document.getElementById('ros-dot');
      if (rosDot) rosDot.className = 'dot ' + (state.connected ? 'on' : 'off');

      const servoDot = document.getElementById('servo-dot');
      if (servoDot) {
        // Green when connected AND servos enabled AND NOT emergency stopped
        // Red/off when disconnected, servos disabled, or emergency stopped
        const servosActive = state.connected && state.servos_enabled && !state.emergency_stopped;
        servoDot.className = 'dot ' + (servosActive ? 'on' : 'off');
      }

      const edot = document.getElementById('estop-dot');
      if (edot) edot.className = 'dot ' + (state.emergency_stopped ? 'off' : 'on');
      const ndot = document.getElementById('nav-dot');
      if (ndot) ndot.className = 'status-dot ok';
    });

    log(t('dash.loaded'));
  </script>
</body>
</html>
