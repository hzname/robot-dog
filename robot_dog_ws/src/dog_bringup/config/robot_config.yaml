# RobotDogQwen Configuration
gait_controller:
  ros__parameters:
    # Walking parameters
    walking:
      speed: 0.5
      turn_speed: 0.5
      gait_period: 1.0
      step_height: 0.08
      step_length: 0.05

    # Trot gait specific parameters
    gait:
      period: 1.0
      timer_rate: 50.0
      step_height: 0.04
      step_length: 0.06
      step_width: 0.02
      body_compensation: 0.02
      roll_compensation: 0.05
      pitch_compensation: 0.05
      transition_duration: 0.5
      trajectory_type: "triangle"
      leg_offsets:
        FL: {x: 0.0, y: 0.0, z: 0.0}
        FR: {x: 0.0, y: 0.0, z: 0.0}
        BL: {x: 0.0, y: 0.0, z: 0.0}
        BR: {x: 0.0, y: 0.0, z: 0.0}

    # Joint limits and PID gains
    joints:
      hip:
        min_position: -1.0
        max_position: 1.0
        p_gain: 100.0
        d_gain: 10.0
      thigh:
        min_position: -1.5
        max_position: 1.5
        p_gain: 150.0
        d_gain: 15.0
      calf:
        min_position: -2.5
        max_position: -0.1
        p_gain: 150.0
        d_gain: 15.0

    # Standing pose
    standing_pose:
      hip: 0.0
      thigh: 0.5
      calf: -1.2

    # Body dimensions
    body:
      standing_height: 0.25
      minimum_height: 0.15
      maximum_height: 0.35

teleop_keyboard:
  ros__parameters:
    speed_scale: 1.0
    turn_scale: 1.0
    deadzone: 0.1
