<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Dog</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav>
    <span class="logo">🐕 RobotDogQwen</span>
    <a href="/dashboard" data-i18n="nav.dashboard">Панель</a>
    <a href="/control" data-i18n="nav.control">Управление</a>
    <a href="/state" data-i18n="nav.state">Состояние</a>
    <a href="/calibration" class="active" data-i18n="nav.calibration">Калибровка</a>
    <span class="status-dot" id="nav-dot"></span>
  </nav>

  <main>
    <!-- Status -->
    <div class="card">
      <div class="status-bar">
        <div class="status-pill"><span class="dot" id="ws-dot"></span> <span data-i18n="common.ws">WebSocket</span></div>
        <div class="status-pill"><span class="dot" id="estop-dot"></span> <span data-i18n="common.estop">E-Stop</span></div>
      </div>
    </div>

    <!-- Profiles -->
    <div class="card">
      <h2 data-i18n="cal.profiles">Профили калибровки</h2>
      <div class="btn-group" style="margin-bottom:15px">
        <button class="btn btn-sm" onclick="saveProfile()" data-i18n="cal.save">💾 Сохранить текущий</button>
        <button class="btn btn-sm btn-blue" onclick="applyCalibration()" data-i18n="cal.apply">⚡ Применить к роботу</button>
        <button class="btn btn-sm btn-dark" onclick="loadProfile('default')" data-i18n="cal.load_default">📂 Загрузить по умолчанию</button>
        <button class="btn btn-sm btn-red" onclick="resetCalibration()" data-i18n="cal.reset">🔄 Сбросить всё</button>
      </div>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:15px">
        <input type="text" id="profile-name" data-i18n-placeholder="cal.profile_name"
               style="flex:1;background:var(--bg-input);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;font-size:.9em" placeholder="Имя профиля...">
        <button class="btn btn-sm" onclick="saveProfileWithName()" data-i18n="cal.save_as">Сохранить как</button>
      </div>
      <div id="profiles-list" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    </div>

    <!-- Per-leg calibration -->
    <div class="grid-2" id="calib-container"></div>
  </main>

  <script src="/static/common.js"></script>
  <script src="/static/i18n.js"></script>
  <script>
    const calibState = {};
    JOINT_NAMES.forEach(j => calibState[j] = 0.0);

    // PWM channel mapping (PCA9685 channels)
    const PWM_CHANNELS = {
      'lf_hip_joint': 0,  'lf_thigh_joint': 1,  'lf_calf_joint': 2,
      'rf_hip_joint': 3,  'rf_thigh_joint': 4,  'rf_calf_joint': 5,
      'lr_hip_joint': 6,  'lr_thigh_joint': 7,  'lr_calf_joint': 8,
      'rr_hip_joint': 9,  'rr_thigh_joint': 10, 'rr_calf_joint': 11,
    };

    // Build calibration UI per leg
    const LEGS = {
      'LF': {titleKey: 'cal.lf', color: '#e94560'},
      'RF': {titleKey: 'cal.rf', color: '#3498db'},
      'LR': {titleKey: 'cal.lr', color: '#f39c12'},
      'RR': {titleKey: 'cal.rr', color: '#9b59b6'},
    };

    const AXIS_LABELS = {hip: 'cal.hip', thigh: 'cal.thigh', calf: 'cal.calf'};
    const JOINT_LIMITS = {hip:[-1.5,1.5], thigh:[-1.5,1.5], calf:[-3.0,0.5]};

    const container = document.getElementById('calib-container');
    Object.entries(LEGS).forEach(([leg, info]) => {
      let html = `<div class="calib-leg" style="border-left:3px solid ${info.color}">`;
      html += `<div class="leg-title" data-i18n="${info.titleKey}">${t(info.titleKey)}</div>`;
      html += `<div style="font-size:.75em;color:var(--text-dim);margin-bottom:8px">${leg}</div>`;
      ['hip','thigh','calf'].forEach(axis => {
        const joint = `${leg.toLowerCase()}_${axis}_joint`;
        const [min, max] = JOINT_LIMITS[axis];
        const def = axis === 'calf' ? -1.2 : 0.0;
        const pwm = PWM_CHANNELS[joint];
        calibState[joint] = def;
        html += `
          <div class="calib-row">
            <label data-i18n="${AXIS_LABELS[axis]}">${t(AXIS_LABELS[axis])}</label>
            <span style="font-size:.7em;color:var(--accent);font-family:monospace;min-width:40px">PWM:${pwm}</span>
            <input type="range" id="cal-${joint}" min="${min}" max="${max}" step="0.01" value="${def}"
                   oninput="onSlider('${joint}',this.value)">
            <span class="val" id="cv-${joint}">${def.toFixed(2)} rad</span>
          </div>`;
      });
      html += '</div>';
      container.innerHTML += html;
    });

    let lastSendTime = 0;
    function onSlider(joint, val) {
      val = parseFloat(val);
      calibState[joint] = val;
      document.getElementById('cv-' + joint).textContent = val.toFixed(2) + ' rad';
      const now = Date.now();
      if (now - lastSendTime > 50) {
        lastSendTime = now;
        const positions = JOINT_NAMES.map(j => calibState[j] || 0.0);
        api('/api/calibration/live', {positions: positions});
      }
    }

    // Send final value when slider released
    document.querySelectorAll('input[type=range][id^=cal-]').forEach(s => {
      s.addEventListener('change', () => {
        const positions = JOINT_NAMES.map(j => calibState[j] || 0.0);
        api('/api/calibration/live', {positions: positions});
      });
    });

    // Apply calibration to robot
    async function applyCalibration() {
      for (const [joint, offset] of Object.entries(calibState)) {
        await api('/api/calibration/set', {joint, offset});
      }
      await api('/api/calibration/apply');
      log(t('cal.applied'));
    }

    // Save profile
    async function saveProfile() {
      const name = document.getElementById('profile-name').value || 'default';
      await saveProfileWithName(name);
    }

    async function saveProfileWithName(name) {
      if (!name) name = document.getElementById('profile-name').value;
      if (!name) { alert(getLang() === 'ru' ? 'Введите имя профиля' : 'Enter profile name'); return; }
      await api('/api/calibration/save', {profile_name: name, calibration: calibState});
      log(t('cal.saved') + name);
      loadProfiles();
    }

    // Load profile
    async function loadProfile(name) {
      const res = await api('/api/calibration/load', {profile_name: name});
      if (res && res.calibration) {
        Object.entries(res.calibration).forEach(([joint, val]) => {
          calibState[joint] = val;
          const slider = document.getElementById('cal-' + joint);
          if (slider) slider.value = val;
          const label = document.getElementById('cv-' + joint);
          if (label) label.textContent = val.toFixed(2) + ' rad';
        });
        log(t('cal.loaded_profile') + name);
      }
    }

    // Reset
    async function resetCalibration() {
      if (!confirm(t('cal.reset_confirm'))) return;
      JOINT_NAMES.forEach(j => {
        calibState[j] = 0.0;
        const slider = document.getElementById('cal-' + j);
        if (slider) slider.value = 0;
        const label = document.getElementById('cv-' + j);
        if (label) label.textContent = '0.00 rad';
      });
      await api('/api/calibration/reset');
      log(t('cal.reset_done'));
    }

    // List profiles
    async function loadProfiles() {
      const res = await api('/api/calibration/profiles');
      const el = document.getElementById('profiles-list');
      if (!res || !res.profiles) return;
      el.innerHTML = res.profiles.map(p =>
        `<button class="btn btn-sm btn-dark" onclick="loadProfile('${p.name}')">📂 ${p.name}</button>`
      ).join('');
    }

    // Logging
    const logEl = document.createElement('div');
    logEl.style.cssText = 'position:fixed;bottom:10px;right:10px;background:var(--bg-card);border:1px solid var(--border);padding:10px;border-radius:8px;font-size:.8em;max-width:300px;max-height:150px;overflow-y:auto;z-index:200';
    document.body.appendChild(logEl);
    function log(msg) {
      const t = new Date().toLocaleTimeString();
      logEl.innerHTML = `<div style="color:var(--text-dim)">[${t}] ${msg}</div>` + logEl.innerHTML;
    }

    // WebSocket - sync status only
    const ws = new StateWS(state => {
      const edot = document.getElementById('estop-dot');
      if (edot) edot.className = 'dot ' + (state.emergency_stopped ? 'off' : 'on');
    });

    loadProfiles();
    log(t('cal.loaded'));
  </script>
</body>
</html>
