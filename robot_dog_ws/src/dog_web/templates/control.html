<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Dog</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav>
    <span class="logo">🐕 RobotDogQwen</span>
    <a href="/dashboard" data-i18n="nav.dashboard">Панель</a>
    <a href="/control" class="active" data-i18n="nav.control">Управление</a>
    <a href="/state" data-i18n="nav.state">Состояние</a>
    <a href="/calibration" data-i18n="nav.calibration">Калибровка</a>
    <span class="status-dot" id="nav-dot"></span>
  </nav>

  <main>
    <!-- Shared status bar with E-Stop buttons -->
    <div class="card">
      <div class="status-bar">
        <div class="status-pill"><span class="dot" id="ws-dot"></span> <span data-i18n="common.ws">WebSocket</span></div>
        <div class="status-pill"><span class="dot" id="ros-dot"></span> <span data-i18n="common.ros">ROS2</span></div>
        <div class="status-pill"><span class="dot" id="servo-dot"></span> <span data-i18n="common.servos">Сервы</span></div>
        <div class="status-pill"><span class="dot" id="estop-dot"></span> <span data-i18n="common.estop">E-Stop</span></div>
        <div class="estop-btns">
          <button class="btn btn-red btn-sm" onclick="api('/api/control/emergency_stop',{stop:true})">🛑 Стоп</button>
          <button class="btn btn-orange btn-sm" onclick="api('/api/control/emergency_stop',{stop:false})">🔓 Снять</button>
        </div>
      </div>
    </div>

    <div class="grid-2">
      <!-- Joystick -->
      <div class="card">
        <h2 data-i18n="ctrl.joystick">Джойстик</h2>
        <div class="joystick-zone" id="joy-zone">
          <div class="joystick-handle" id="joy-handle"></div>
        </div>
        <div style="text-align:center;margin-top:10px;color:var(--text-dim);font-size:.85em" data-i18n="ctrl.joystick_hint">Тяните: X = вбок, Y = вперёд/назад</div>
      </div>

      <!-- D-Pad + rotation -->
      <div class="card">
        <h2 data-i18n="ctrl.dpad">D-Pad</h2>
        <div class="dpad" style="margin-bottom:20px">
          <button class="btn up" id="btn-fwd" data-i18n="ctrl.fwd">↑ Вперёд</button>
          <button class="btn left" id="btn-left" data-i18n="ctrl.left">← Влево</button>
          <button class="btn btn-red stop" id="btn-stop" data-i18n="ctrl.stop">■ СТОП</button>
          <button class="btn right" id="btn-right" data-i18n="ctrl.right">→ Вправо</button>
          <button class="btn down" id="btn-back" data-i18n="ctrl.back">↓ Назад</button>
        </div>

        <h2 data-i18n="ctrl.rotation">Поворот</h2>
        <div class="btn-group" style="justify-content:center;margin-bottom:20px">
          <button class="btn btn-blue" id="btn-ccw" data-i18n="ctrl.ccw">↺ Против ч.с.</button>
          <button class="btn btn-blue" id="btn-cw" data-i18n="ctrl.cw">↻ По ч.с.</button>
        </div>

        <h2 data-i18n="ctrl.speed">Скорость</h2>
        <div style="display:flex;align-items:center;gap:12px">
          <input type="range" id="speed" min="0.1" max="2.0" step="0.1" value="0.5" style="flex:1">
          <span id="speed-val" style="font-family:monospace;color:var(--green)">0.5</span>
        </div>
      </div>
    </div>

    <!-- Emergency + Servos -->
    <div class="card">
      <div class="btn-group" style="justify-content:center">
        <button class="btn" onclick="api('/api/control/servo_enable',{enable:true})" data-i18n="ctrl.servo_on">✅ Включить сервы</button>
        <button class="btn btn-dark" onclick="api('/api/control/servo_enable',{enable:false})" data-i18n="ctrl.servo_off">❌ Выключить сервы</button>
        <button class="btn btn-red btn-lg" onclick="api('/api/control/emergency_stop',{stop:true})" data-i18n="ctrl.estop">🚨 АВАРИЙНАЯ ОСТАНОВКА</button>
        <button class="btn btn-orange" onclick="api('/api/control/emergency_stop',{stop:false})" data-i18n="ctrl.estop_release">🔓 Снять блокировку</button>
      </div>
    </div>

    <!-- Live feedback -->
    <div class="card">
      <h2 data-i18n="ctrl.feedback">Обратная связь</h2>
      <div id="feedback" style="font-family:monospace;font-size:.9em;color:var(--text-dim);max-height:120px;overflow-y:auto"></div>
    </div>
  </main>

  <script src="/static/common.js"></script>
  <script src="/static/i18n.js"></script>
  <script>
    let speed = 0.5;
    let sending = false;

    const fb = document.getElementById('feedback');
    function fbLog(msg) {
      const t = new Date().toLocaleTimeString();
      fb.innerHTML = `<div>[${t}] ${msg}</div>` + fb.innerHTML;
    }

    // Speed slider
    document.getElementById('speed').oninput = e => {
      speed = parseFloat(e.target.value);
      document.getElementById('speed-val').textContent = speed.toFixed(1);
    };

    // D-pad buttons - hold to move
    const cmds = {
      'btn-fwd':   { linear_x: 0.5 },
      'btn-back':  { linear_x: -0.5 },
      'btn-left':  { linear_y: 0.5 },
      'btn-right': { linear_y: -0.5 },
      'btn-ccw':   { angular_z: 1.0 },
      'btn-cw':    { angular_z: -1.0 },
    };

    Object.entries(cmds).forEach(([id, base]) => {
      const btn = document.getElementById(id);
      let interval = null;

      function send() {
        const data = {};
        if (base.linear_x !== undefined) data.linear_x = base.linear_x * speed;
        if (base.linear_y !== undefined) data.linear_y = base.linear_y * speed;
        if (base.angular_z !== undefined) data.angular_z = base.angular_z * speed;
        api('/api/control/cmd_vel', data);
        fbLog(`cmd_vel: lx=${data.linear_x?.toFixed(2)||0} ly=${data.linear_y?.toFixed(2)||0} az=${data.angular_z?.toFixed(2)||0}`);
      }

      btn.addEventListener('mousedown', () => { send(); interval = setInterval(send, 200); });
      btn.addEventListener('mouseup', () => { clearInterval(interval); api('/api/control/stop', {}); });
      btn.addEventListener('mouseleave', () => { clearInterval(interval); api('/api/control/stop', {}); });

      // Touch support
      btn.addEventListener('touchstart', e => { e.preventDefault(); send(); interval = setInterval(send, 200); });
      btn.addEventListener('touchend', () => { clearInterval(interval); api('/api/control/stop', {}); });
    });

    // Stop button
    document.getElementById('btn-stop').addEventListener('click', () => {
      api('/api/control/stop', {});
      fbLog('STOP');
    });

    // Joystick
    const zone = document.getElementById('joy-zone');
    const handle = document.getElementById('joy-handle');
    let joyActive = false;
    let joyInterval = null;

    function joyUpdate(cx, cy) {
      const rect = zone.getBoundingClientRect();
      const midX = rect.width / 2;
      const midY = rect.height / 2;
      let dx = cx - rect.left - midX;
      let dy = cy - rect.top - midY;
      const maxR = midX - 30;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > maxR) { dx = dx/dist*maxR; dy = dy/dist*maxR; }
      handle.style.left = (midX + dx - 30) + 'px';
      handle.style.top = (midY + dy - 30) + 'px';
      const nx = -dx / maxR;
      const ny = -dy / maxR;
      return { linear_x: ny * speed, linear_y: nx * speed, angular_z: 0 };
    }

    let lastJoyCmd = null;

    function joySend(cx, cy) {
      const cmd = joyUpdate(cx, cy);
      lastJoyCmd = cmd;
      api('/api/control/cmd_vel', cmd);
    }

    zone.addEventListener('mousedown', e => {
      e.preventDefault();
      joyActive = true;
      joyUpdate(e.clientX, e.clientY);
    });
    document.addEventListener('mousemove', e => {
      if (joyActive) joySend(e.clientX, e.clientY);
    });
    document.addEventListener('mouseup', () => {
      if (joyActive) {
        joyActive = false;
        lastJoyCmd = null;
        handle.style.left = 'calc(50% - 30px)';
        handle.style.top = 'calc(50% - 30px)';
        api('/api/control/stop', {});
      }
    });

    // Touch joystick
    zone.addEventListener('touchstart', e => {
      e.preventDefault();
      joyActive = true;
      joyUpdate(e.touches[0].clientX, e.touches[0].clientY);
    });
    document.addEventListener('touchmove', e => {
      if (joyActive) joySend(e.touches[0].clientX, e.touches[0].clientY);
    });
    document.addEventListener('touchend', () => {
      if (joyActive) {
        joyActive = false;
        lastJoyCmd = null;
        handle.style.left = 'calc(50% - 30px)';
        handle.style.top = 'calc(50% - 30px)';
        api('/api/control/stop', {});
      }
    });

    fbLog(t('ctrl.loaded'));

    // Status bar updates via WebSocket
    const ws = new StateWS(state => {
      const wsDot = document.getElementById('ws-dot');
      if (wsDot) wsDot.className = 'dot on';
      const rosDot = document.getElementById('ros-dot');
      if (rosDot) rosDot.className = 'dot ' + (state.connected ? 'on' : 'off');
      const servoDot = document.getElementById('servo-dot');
      if (servoDot) {
        const active = state.connected && state.servos_enabled && !state.emergency_stopped;
        servoDot.className = 'dot ' + (active ? 'on' : 'off');
      }
      const estopDot = document.getElementById('estop-dot');
      if (estopDot) estopDot.className = 'dot ' + (state.emergency_stopped ? 'off' : 'on');
      const navDot = document.getElementById('nav-dot');
      if (navDot) navDot.className = 'status-dot ok';
    });
  </script>
</body>
</html>
