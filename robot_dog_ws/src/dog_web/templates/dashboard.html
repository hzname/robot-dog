<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Dog</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav>
    <span class="logo">🐕 RobotDogQwen</span>
    <a href="/dashboard" class="active" data-i18n="nav.dashboard">Панель</a>
    <a href="/control" data-i18n="nav.control">Управление</a>
    <a href="/state" data-i18n="nav.state">Состояние</a>
    <a href="/calibration" data-i18n="nav.calibration">Калибровка</a>
    <span class="status-dot" id="nav-dot"></span>
  </nav>

  <main>
    <!-- Status bar -->
    <div class="card">
      <div class="status-bar">
        <div class="status-pill"><span class="dot" id="ws-dot"></span> <span data-i18n="common.ws">WebSocket</span></div>
        <div class="status-pill"><span class="dot" id="ros-dot"></span> <span data-i18n="common.ros">ROS2</span></div>
        <div class="status-pill"><span class="dot" id="servo-dot"></span> <span data-i18n="common.servos">Сервы</span></div>
        <div class="status-pill"><span class="dot" id="estop-dot"></span> <span data-i18n="common.estop">E-Stop</span></div>
      </div>
    </div>

    <!-- Joint overview -->
    <div class="card">
      <h2 data-i18n="dash.joints">Позиции суставов</h2>
      <div class="joint-grid" id="joint-overview"></div>
    </div>

    <!-- Quick actions -->
    <div class="grid-2">
      <div class="card">
        <h2 data-i18n="dash.quick">Быстрые действия</h2>
        <div class="btn-group">
          <button class="btn" onclick="api('/api/control/servo_enable',{enable:true})" data-i18n="dash.servo_on">Включить сервы</button>
          <button class="btn btn-dark" onclick="api('/api/control/servo_enable',{enable:false})" data-i18n="dash.servo_off">Выключить сервы</button>
          <button class="btn btn-red btn-lg" onclick="api('/api/control/emergency_stop',{stop:true})" data-i18n="dash.estop">АВАРИЙНАЯ ОСТАНОВКА</button>
          <button class="btn btn-orange" onclick="api('/api/control/emergency_stop',{stop:false})" data-i18n="dash.estop_release">🔓 Снять блокировку</button>
        </div>
      </div>
      <div class="card">
        <h2 data-i18n="dash.movement">Движение</h2>
        <div class="dpad">
          <button class="btn up" onmousedown="api('/api/control/cmd_vel',{linear_x:0.5})" onmouseup="api('/api/control/stop',{})">↑</button>
          <button class="btn left" onmousedown="api('/api/control/cmd_vel',{linear_y:0.5})" onmouseup="api('/api/control/stop',{})">←</button>
          <button class="btn btn-red stop" onclick="api('/api/control/stop',{})">■</button>
          <button class="btn right" onmousedown="api('/api/control/cmd_vel',{linear_y:-0.5})" onmouseup="api('/api/control/stop',{})">→</button>
          <button class="btn down" onmousedown="api('/api/control/cmd_vel',{linear_x:-0.5})" onmouseup="api('/api/control/stop',{})">↓</button>
        </div>
      </div>
    </div>

    <!-- Log -->
    <div class="card">
      <h2 data-i18n="dash.log">Журнал событий</h2>
      <div id="log" style="font-family:monospace;font-size:.85em;color:var(--text-dim);max-height:150px;overflow-y:auto;"></div>
    </div>
  </main>

  <script src="/static/common.js"></script>
  <script src="/static/i18n.js"></script>
  <script>
    const logEl = document.getElementById('log');
    function log(msg) {
      const t = new Date().toLocaleTimeString();
      logEl.innerHTML = `<div>[${t}] ${msg}</div>` + logEl.innerHTML;
    }

    // Build joint overview
    const jDiv = document.getElementById('joint-overview');
    JOINT_NAMES.forEach(name => {
      jDiv.innerHTML += `<div class="joint-card"><div class="name">${name}</div><div class="value" id="j-${name}">0.00</div><div class="bar-wrap"><div class="bar" id="jb-${name}" style="width:50%"></div></div></div>`;
    });

    // WebSocket
    const ws = new StateWS(state => {
      (state.joint_positions || []).forEach((v, i) => {
        const name = JOINT_NAMES[i];
        const el = document.getElementById('j-' + name);
        const bar = document.getElementById('jb-' + name);
        if (el) el.textContent = v.toFixed(3);
        if (bar) {
          const pct = Math.min(100, Math.max(0, (v + 3.14) / 6.28 * 100));
          bar.style.width = pct + '%';
        }
      });

      const edot = document.getElementById('estop-dot');
      if (edot) edot.className = 'dot ' + (state.emergency_stopped ? 'off' : 'on');
      const ndot = document.getElementById('nav-dot');
      if (ndot) ndot.className = 'status-dot ok';
    });

    log(t('dash.loaded'));
  </script>
</body>
</html>
